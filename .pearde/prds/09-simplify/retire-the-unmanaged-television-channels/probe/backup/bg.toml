# television cable channel: `tv bg` — the background-override picker behind
# `theme bg` (theme.nu).
#
# source : _theme_bg_list from theme.nu — candidates around the CURRENTLY showing
#          background: a lightness ladder (mix toward black/white) plus per-channel
#          R/G/B tints. Rows are "#rrggbb  <label>"; the ladder order is meaningful,
#          so sorting and frecency are off.
# preview: bg-preview.sh paints a swatch card and emits one OSC 11 so the translucent
#          window previews the candidate for real — no tinty apply, no hook chain.
# enter  : prints the row; theme.nu takes its first token as the hex, writes it to
#          tinty's config.toml (live + chezmoi source) and regenerates the artifacts.
#          Esc restores the active background.

[metadata]
name = "bg"
description = "Background override — lightness ladder and RGB tints, live preview"
requirements = ["nu"]

[source]
command = "nu -n -c 'source /Users/feb/.config/nushell/theme.nu; _theme_bg_list | to text'"
output = "{}"
no_sort = true
frecency = false

[preview]
command = "/Users/feb/.config/television/bg-preview.sh '{}'"

[ui]
preview_panel = { size = 50 }

[ui.input_bar]
header = "background override: {}"
