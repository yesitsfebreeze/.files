# Single source of truth for what the dotfiles install: each entry maps one tool
# to its package name per manager (empty string = not packaged there, installer
# skips or falls back). macOS + Linux target. Editing this re-triggers the
# run_onchange installer on next apply.

packages:
    - name: burrito       # terminal multiplexer (daemon + 9x9 grid nav, tool overlays), shell-side
      brew: ""            # not packaged on any manager; Go repo, built by its own `just install`
      apt: ""
      pacman: ""
      dnf: ""
      just_git: https://github.com/yesitsfebreeze/burrito
      bin: brr

    - name: keydr         # terminal typing tutor with adaptive learning (keybr-style weak-key drills)
      brew: ""            # not packaged anywhere; built from source via cargo_git
      apt: ""
      pacman: ""
      dnf: ""
      cargo_git: https://github.com/yesitsfebreeze/keydr

    - name: neovim
      brew: neovim
      apt: neovim
      pacman: neovim
      dnf: neovim
      gh_release: neovim/neovim
      bin: nvim

    - name: nushell
      brew: nushell
      apt: ""             # not in default apt; brew/pacman/gh-release install
      pacman: nushell
      dnf: ""
      gh_release: nushell/nushell
      bin: nu

    - name: ripgrep
      brew: ripgrep
      apt: ripgrep
      pacman: ripgrep
      dnf: ripgrep

    - name: fd
      brew: fd
      apt: fd-find        # binary is `fdfind` on Debian/Ubuntu
      pacman: fd
      dnf: fd-find

    - name: fzf
      brew: fzf
      apt: fzf
      pacman: fzf
      dnf: fzf

    - name: entr          # run arbitrary commands when files change (file-watcher)
      brew: entr
      apt: entr
      pacman: entr
      dnf: entr

    - name: television    # fuzzy finder TUI (binary: `tv`)
      brew: television
      apt: ""             # not in Debian/Ubuntu repos; brew/pacman/gh-release install
      pacman: television
      dnf: ""             # not packaged for Fedora; gh-release / cargo fallback
      gh_release: alexpasmantier/television
      bin: tv

    - name: bat
      brew: bat
      apt: bat            # binary is `batcat` on Debian/Ubuntu
      pacman: bat
      dnf: bat

    - name: zoxide
      brew: zoxide
      apt: zoxide
      pacman: zoxide
      dnf: zoxide

    - name: starship
      brew: starship
      apt: ""             # use official installer; not in apt
      pacman: starship
      dnf: ""

    - name: jq
      brew: jq
      apt: jq
      pacman: jq
      dnf: jq

    - name: imagemagick   # bake gaussian blur into the wezterm background image (`magick`/`convert`)
      brew: imagemagick
      apt: imagemagick
      pacman: imagemagick
      dnf: imagemagick

    - name: python3       # stdlib only — no pip packages needed
      brew: python
      apt: python3
      pacman: python
      dnf: python3

    - name: git
      brew: git
      apt: git
      pacman: git
      dnf: git

    - name: delta
      brew: git-delta
      apt: ""             # `git-delta` not in default apt; cargo/brew/repo
      pacman: git-delta
      dnf: git-delta

    - name: lazygit
      brew: lazygit
      apt: ""             # PPA/repo needed; not in default apt
      pacman: lazygit
      dnf: lazygit
      gh_release: jesseduffield/lazygit

    - name: gh
      brew: gh
      apt: ""             # not in default apt (needs GitHub's apt repo); gh-release install
      pacman: github-cli
      dnf: gh
      gh_release: cli/cli

    - name: worktrunk     # git worktree manager (binary: `wt`)
      brew: worktrunk
      apt: ""             # not in Debian/Ubuntu repos; gh-release install
      pacman: ""          # AUR-only; gh-release / cargo fallback
      dnf: ""             # not packaged for Fedora; gh-release / cargo fallback
      gh_release: max-sixty/worktrunk
      bin: wt

    - name: just          # command runner / `.justfile` task automation
      brew: just
      apt: just           # Debian 13+/Ubuntu 24.04+; older releases fall back to cargo
      pacman: just
      dnf: just

    - name: bubblewrap    # Linux subprocess sandbox (binary: `bwrap`)
      brew: ""            # macOS uses Seatbelt; no brew pkg
      apt: bubblewrap
      pacman: bubblewrap
      dnf: bubblewrap

    - name: gnupg         # GPG (binary: `gpg`) — required backend for `pass`
      brew: gnupg
      apt: gnupg
      pacman: gnupg
      dnf: gnupg2         # Fedora packages GnuPG 2 as `gnupg2`

    - name: pass          # standard unix password manager (gpg-backed password-store)
      brew: pass
      apt: pass
      pacman: pass
      dnf: pass

    - name: tinty         # Tinted Theming CLI — base16/base24 engine behind the live `theme` switcher
      brew: tinted-theming/tinty/tinty   # not in homebrew-core; fully-qualified name auto-taps
      apt: ""             # not in Debian/Ubuntu repos; gh-release install
      pacman: ""          # AUR-only; gh-release / cargo fallback
      dnf: ""             # not packaged for Fedora; gh-release / cargo fallback
      gh_release: tinted-theming/tinty

    - name: kern          # self-learning memory daemon + MCP server for AI agents
      brew: ""            # not packaged on any manager; gh-release install
      apt: ""
      pacman: ""
      dnf: ""             # the crates.io `kern` is an unrelated library, so no cargo fallback
      gh_release: yesitsfebreeze/relay-kern

    - name: pi            # pi coding agent — npm-published CLI
      brew: ""            # not on any package manager; installed globally via npm
      apt: ""
      pacman: ""
      dnf: ""
      npm: "@earendil-works/pi-coding-agent"

    - name: docker        # container engine. pacman/dnf are covered by the package lists;
      brew: ""            # macOS installs Docker Desktop manually.
      apt: ""             # Use Docker's official apt repo or Docker Desktop.
      pacman: docker
      dnf: docker

    # Chromium/Electron runtime libs (no binary, Linux-only). `lib: true` marks
    # them binary-less so the cargo/missing-check loops skip them.
    - name: libnss3
      lib: true
      brew: ""
      apt: libnss3
      pacman: nss
      dnf: nss

    - name: libnspr4
      lib: true
      brew: ""
      apt: libnspr4
      pacman: nspr
      dnf: nspr

    # Nerd Font: package-manager coverage is thin, so the installer also fetches it
    # from the nerd-fonts release when missing.
    - name: karabiner-elements   # macOS keyboard customizer (GUI app). macOS-only.
      brew: karabiner-elements
      cask: true
      apt: ""
      pacman: ""
      dnf: ""

    - name: nerd-font
      brew: font-caskaydia-cove-nerd-font
      cask: true
      apt: ""               # not packaged; installed via nerd-fonts release fallback
      pacman: ""            # AUR-only (otf-cascadia-code-nerd); release fallback
      dnf: ""               # not packaged; release fallback
      nerdfont_asset: CaskaydiaCove
