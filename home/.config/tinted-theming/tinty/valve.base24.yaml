system: "base24"
name: "valve"
author: "feb — Counter-Strike 1.6 VGUI: the olive-green in-game interface, base24 variant"
description: "Custom scheme (base24 superset of valve.base16), copied from the real CS 1.6 interface: the olive-green panel (#4a5942), off-white text, sage dim text, bevel borders and the CS-yellow accent (ekmas/cs16.css tokens). base24-aware programs use base12-17 for distinct bright ANSI colours; everything else resolves as base16-valve. Tracked source lives here in the config dir; copied into the (gitignored) tinty data-dir custom-schemes/ so tinty and the colors generators resolve base24-valve."
variant: "dark"
palette:
  base00: "#4a5942" # background — THE olive-green VGUI panel
  base01: "#333b2c" # lighter background — inset panels (secondary-bg #3e4637 toward border-dark)
  base02: "#57664b" # selection — the scrollbar-track olive lifted
  base03: "#a0aa95" # comments — the game's sage text-3, status text
  base04: "#8c9284" # darker foreground — border-light, the bevel's lit side (active panes)
  base05: "#dedfd6" # foreground — the game's off-white text
  base06: "#e6ecdf" # light foreground
  base07: "#ffffff" # brightest — button text
  base08: "#f0a590" # red — the red-button family, pastelized for the olive
  base09: "#d5b776" # orange — the tan tint
  base0A: "#c4b550" # yellow — THE CS accent, highlighted items
  base0B: "#c2dfba" # green — pale green tint
  base0C: "#7eb7cd" # cyan — light blue tint
  base0D: "#99ccff" # blue — the CT blue
  base0E: "#c99bc2" # purple — the purple-button family, lifted
  base0F: "#b59a7f" # brown — the game's brown button
  base10: "#3e4637" # darker background — the game's secondary-bg inset
  base11: "#292c21" # darkest background — border-dark, the bevel's unlit side
  base12: "#f5b0a0" # bright red
  base13: "#ecd688" # bright yellow
  base14: "#d4ecc4" # bright green
  base15: "#a8d8e8" # bright cyan
  base16: "#c3e0ff" # bright blue
  base17: "#d9b8d4" # bright purple