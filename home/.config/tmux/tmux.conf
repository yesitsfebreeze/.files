# tmux.conf — the multiplexer base. tmux owns windows, panes, addressing,
# splits, scrollback, the status bar. 07-multiplexer I1: every gesture works on
# a bare server with no WezTerm. Each TRAP is one line; manual → internals/tmux.

# ── terminal integration ─────────────────────────────────────────
# TRAP: no tmux-256color, no session. manual → "The terminal-integration floor".
set -g default-terminal "tmux-256color"
# `sync` = DEC 2026 frames, `usstyle` = coloured undercurl, `extkeys` = Shift+Enter.
# TRAP: indexed `set`, never `set -a` — every reload appends again.
set -s terminal-features[3] '*:RGB:hyperlinks:usstyle:sync'
set -s terminal-features[4] 'xterm*:extkeys'
set -g escape-time 10
set -g focus-events on
set -g mouse on

# theme.sh and font.sh reach the terminal as passthrough from a pane.
set -gw allow-passthrough on

# ── where a pane actually is ────────────────────────────────────
# `#{E:@cwd}` is the pane's REAL cwd (OSC 7, same host only), used for every
# "here". TRAP: `pane_current_path` is where the pane STARTED — nushell never
# moves its OS cwd. manual → internals/tmux, "Where a split starts".
set -g @cwd '#{?#{m:file://#{host}/*,#{pane_path}},#{s|^file.//[^/]*/|/|:pane_path},#{pane_current_path}}'

# ── addressing ──────────────────────────────────────────────────
set -g base-index 1
set -gw pane-base-index 1

set -gw automatic-rename on

# ── what runs in a pane ─────────────────────────────────────────
# TRAP: export XDG_CONFIG_HOME before exec, nu from PATH, $SHELL fallback.
# manual → internals/tmux, "`default-command`: three things, each of which cost a day".
# default-command is POSIX sh, run through default-shell ($SHELL); with nu as
# the login shell every new pane exited at once.
set -g default-shell /bin/sh
set -g default-command 'XDG_CONFIG_HOME="${XDG_CONFIG_HOME:-$HOME/.config}"; export XDG_CONFIG_HOME; if command -v nu >/dev/null 2>&1; then exec nu --config "$XDG_CONFIG_HOME/nushell/config.nu" --env-config "$XDG_CONFIG_HOME/nushell/env.nu"; else exec "${SHELL:-/bin/sh}"; fi'
set -ga update-environment XDG_CONFIG_HOME

# ── F5 the cockpit; an arrow in it is move mode until Enter ──────
# In move mode (the `jump` table) arrows walk panes, Shift+arrow splits the
# whole window (greedy, `-f`), Alt+arrow only the pane you are in, q
# closes, and each re-arms the table; Enter or Escape ends it, any other key
# ends it too. The cockpit's `s s` finds a pane by name or content.
# manual → internals/tmux, "Move mode".
bind -n F5 run-shell -b '~/.local/bin/cockpit "#{client_name}" "#{pane_id}" #{client_width} #{client_height}'
# `s s` sorts by this: the time of the input that focused the pane.
set-hook -g pane-focus-in 'set -pF @used "#{client_activity}"'
bind -T jump Enter   switch-client -T root
bind -T jump Escape  switch-client -T root
bind -T jump Left    { select-pane -L ; switch-client -T jump }
bind -T jump Right   { select-pane -R ; switch-client -T jump }
bind -T jump Up      { select-pane -U ; switch-client -T jump }
bind -T jump Down    { select-pane -D ; switch-client -T jump }
bind -T jump S-Left  { split-window -fhb -c "#{E:@cwd}" ; switch-client -T jump }
bind -T jump S-Right { split-window -fh  -c "#{E:@cwd}" ; switch-client -T jump }
bind -T jump S-Up    { split-window -fvb -c "#{E:@cwd}" ; switch-client -T jump }
bind -T jump S-Down  { split-window -fv  -c "#{E:@cwd}" ; switch-client -T jump }
bind -T jump M-Left  { split-window -hb  -c "#{E:@cwd}" ; switch-client -T jump }
bind -T jump M-Right { split-window -h   -c "#{E:@cwd}" ; switch-client -T jump }
bind -T jump M-Up    { split-window -vb  -c "#{E:@cwd}" ; switch-client -T jump }
bind -T jump M-Down  { split-window -v   -c "#{E:@cwd}" ; switch-client -T jump }
bind -T jump q       { kill-pane ; switch-client -T jump }

# ── F5 w z — zen mode ────────────────────────────────────────────
# Every window is a strip: the active pane centred at `@zen-width` percent
# (50), the panes before it stacked on the left, those after it on the
# right, a blank spacer on an empty side; a lone pane has no border. One
# switch for every window; `set -g @zen 1` starts on. The hooks refit on
# every split, close, drag, resize and focus change.
# TRAP: pane-focus-in cannot move focus; after-select-pane can, and it also
# fires for the hook's own `select-pane -l`, which then lands on a real pane.
# manual → internals/tmux, "F5 w z — zen mode".
# Both gated on `@zen`: off, a focus change or resize forks nothing (`toggle`
# runs `apply` itself, so the spacers still go when it turns off).
set-hook -g window-layout-changed 'if -F "#{@zen}" { run-shell -b "~/.local/bin/tmux-zen apply #{window_id}" }'
set-hook -g after-select-pane "if -F '#{@zen}' { if -F '#{@zen_spacer}' { select-pane -l } { run-shell -b '~/.local/bin/tmux-zen apply #{window_id}' } }"

# ── copy mode ────────────────────────────────────────────────
# Stated — tmux otherwise derives mode-keys from $EDITOR.
set -gw mode-keys vi

# TRAP: every stock copy path is sinkless, so every path below names this
# option via `send -FX`. manual → "Choosing the sink is not the same as using it".
set -g @copy-pipe 'pbcopy'
set -s set-clipboard off

# TRAP: `v` is rectangle-toggle, not begin-selection (`Space` is).
bind -T copy-mode-vi y send -FX copy-pipe-and-cancel "#{@copy-pipe}"

# `Enter` opens an OSC 8 link or plain URL under the cursor, else copies.
bind -T copy-mode-vi Enter run-shell -b '~/.local/bin/tmux-copy-open-link "#{pane_id}"'

# Ctrl+C and Escape: act on a selection if there is one, else leave.
bind -T copy-mode-vi C-c if -F '#{selection_present}' \
    'send -FX copy-pipe-and-cancel "#{@copy-pipe}"' \
    'send -X cancel'
bind -T copy-mode-vi Escape if -F '#{selection_present}' \
    'send -X clear-selection' \
    'send -X cancel'

# TRAP: stock `next-word` wraps lines; `next-word-end` parks at the last word.
bind -T copy-mode-vi w send -X next-word-end

# `Space` grows: link or word, then the line, then a line down per press. manual → guide/copy.
bind -T copy-mode-vi Space run-shell -b '~/.local/bin/tmux-copy-expand "#{pane_id}"'

# A motion would EXTEND an open selection, so plain moves clear it first.
bind -T copy-mode-vi h send -X clear-selection \; send -X cursor-left
bind -T copy-mode-vi j send -X clear-selection \; send -X cursor-down
bind -T copy-mode-vi k send -X clear-selection \; send -X cursor-up
bind -T copy-mode-vi l send -X clear-selection \; send -X cursor-right
bind -T copy-mode-vi Left  send -X clear-selection \; send -X cursor-left
bind -T copy-mode-vi Down  send -X clear-selection \; send -X cursor-down
bind -T copy-mode-vi Up    send -X clear-selection \; send -X cursor-up
bind -T copy-mode-vi Right send -X clear-selection \; send -X cursor-right
# Shift (`W`, `L`, `P`) takes one unit, copies and leaves.
bind -T copy-mode-vi W {
    send -X select-word
    send -FX copy-pipe-and-cancel "#{@copy-pipe}"
}
bind -T copy-mode-vi L send -FX copy-pipe-end-of-line-and-cancel "#{@copy-pipe}"

# TRAP: no `select-paragraph` and `next-paragraph` mis-anchors (3.7c), so `p`
# takes the WHOLE paragraph; the guards drop the blank separator lines.
bind -T copy-mode-vi p {
    send -X clear-selection
    send -X previous-paragraph
    if -F '#{==:#{copy_cursor_line},}' { send -X cursor-down }
    send -X begin-selection
    send -X next-paragraph
    if -F '#{==:#{copy_cursor_line},}' { send -X cursor-up ; send -X end-of-line }
}
bind -T copy-mode-vi P {
    send -X clear-selection
    send -X previous-paragraph
    if -F '#{==:#{copy_cursor_line},}' { send -X cursor-down }
    send -X begin-selection
    send -X next-paragraph
    if -F '#{==:#{copy_cursor_line},}' { send -X cursor-up ; send -X end-of-line }
    send -FX copy-pipe-and-cancel "#{@copy-pipe}"
}

# `F5 c s` stages the pane's last Claude session id as a `cr` line; again cycles.
# TRAP: cancel copy mode FIRST — a pane in a mode swallows `send-keys`.
bind -T copy-mode-vi s send -X cancel \; run-shell -b '~/.local/bin/tmux-claude-resume "#{pane_id}"'

# ── the mouse copies too ────────────────────────────────────────
# `mouse_any_flag` leaves a mouse-tracking program its own clicks.
# manual → internals/tmux, "Taking the mouse means owing it a clipboard".
bind -T copy-mode-vi MouseDragEnd1Pane send -FX copy-pipe-and-cancel "#{@copy-pipe}"
bind -n DoubleClick1Pane select-pane -t = \; if -F '#{||:#{pane_in_mode},#{mouse_any_flag}}' \
    { send -M } \
    { copy-mode -H ; send -X select-word ; run-shell -d 0.3 ; send -FX copy-pipe-and-cancel "#{@copy-pipe}" }
bind -n TripleClick1Pane select-pane -t = \; if -F '#{||:#{pane_in_mode},#{mouse_any_flag}}' \
    { send -M } \
    { copy-mode -H ; send -X select-line ; run-shell -d 0.3 ; send -FX copy-pipe-and-cancel "#{@copy-pipe}" }

# ── status bar ───────────────────────────────────────────────
# ANSI slots, never hex. One row: clock, `tmux-sys`, key table, window numbers.
# manual → internals/tmux, "The status bar".
set -g status on
# TRAP: never `top` on 3.7c — every pane redraw paints over a popup's first row.
set -g status-position bottom
set -g status-interval 5
set -g status-style 'bg=default,fg=colour8'
set -g status-left-length 120
set -g status-right-length 0

# TRAP: `right` only reaches the terminal's edge while `status-right` is EMPTY.
set -g status-justify right
set -g status-right ''

# The mode chip leads the bar, as in nvim: COCKPIT while F5's popup is up
# (`@cockpit`, set by the cockpit script), JUMP in move mode (the `jump` key
# table), COPY in copy mode, ZEN when zen is on, else NORMAL.
set -g @mode '#{?#{==:#{@cockpit},1},COCKPIT,#{?#{==:#{client_key_table},jump},JUMP,#{?pane_in_mode,COPY,#{?#{==:#{@zen},1},ZEN,NORMAL}}}}'
set -g status-left '#[fg=colour4,reverse,bold] #{E:@mode} #[default]#[fg=colour7] %H:%M #[fg=colour8] #(~/.local/bin/tmux-sys)'

# TRAP: `$HOME` and `#(...)` are not free inside an if-shell arm, so the arm
# only sets `@host` and the header format is written once below.
set -g @host ''
if-shell '[ -n "$SSH_CONNECTION" ]' 'set -g @host "#{host_short}  "'

set -g window-status-separator ''
# Every window's number, the current one in the accent; after the last one
# (`window_end_flag`), every process on the server — all panes of all
# sessions — as a reverse-video chip, one cell of padding each side. Counted
# by `tmux-zen procs`, which skips zen's spacers and popups. TRAP: a format
# inside `#()` here is expanded twice (`E:`), and its comma splits the `?`.
set -g @procs '#{?window_end_flag, #[fg=colour8 reverse] #(~/.local/bin/tmux-zen procs) #[noreverse],}'
set -gw window-status-format ' #I#{E:@procs}'
set -gw window-status-current-format ' #[bold,underscore]#I#[nobold,nounderscore]#{E:@procs}'

# Style options, not inline, so colors.conf can override them.
set -gw window-status-current-style 'fg=colour4'
set -gw window-status-style 'fg=colour8'

# Each pane's top border is its header: pane number, host, directory, git,
# zoom, mode, centred. Only the active pane is framed: an inactive seam is
# `hidden` (SGR 8 — border cells keep their attributes, unlike window-style),
# so the seams around the active pane read as its one border; the header is
# plain text in the border's colour. TRAP: `:@cwd` names a VARIABLE, so the
# cwd is spelled out — keep it in step with `@cwd`.
set -gw pane-border-format "#[align=centre,nohidden] #{pane_index}  #{E:@host}#{?#{m:file://#{host}/*,#{pane_path}},#{s|^file.//[^/]*/|/|;s|^$HOME|~|:pane_path},#{s|^$HOME|~|:pane_current_path}} #(~/.local/bin/tmux-git '#{E:@cwd}')#{?window_zoomed_flag, zoom,}#{?pane_in_mode, #{pane_mode},} "
set -gw pane-border-style 'fg=colour8,hidden'
set -gw pane-active-border-style 'fg=colour7'
set -gw pane-border-lines single
# A tmux with `pane-border-type` (next-3.9 + tmux PR #5433) gives every pane
# its own rounded frame, title centred on the top edge; inactive frames stay
# `hidden`, so only the active pane shows one. Stock tmux keeps the seams.
%if "#{pane-border-type}"
set -gw pane-border-lines rounded
set -gw pane-border-type separate-active
%endif
# Off: with two panes tmux otherwise colours only the half of the seam
# nearest the active pane, and the frame stops at 50% height.
set -gw pane-border-indicators off
set -gw pane-border-status top

# The inactive panes recede. A COLOUR, never the `dim` attribute: tmux merges
# only the colours of window-style into a cell, so `dim` emits nothing
# (measured 2026-09-27 on 3.7c). manual → internals/tmux, "The inactive panes recede".
# TRAP: window-active-style MERGES over window-style, so `fg=default` there is
# "no override" and the dimming wins in the active pane too — every pane dimmed.
# `terminal` is the emulator's own colour, and leaves the ground alone so the
# window's opacity and blur survive.
set -gw window-style 'fg=colour8'
set -gw window-active-style 'fg=terminal,bg=terminal'
set -gw mode-style 'bg=colour8,fg=colour15'
set -g message-style 'bg=colour8,fg=colour15'

# ── palette ──────────────────────────────────────────────────
# TRAP: `-q` IS the existence test — tmux has no `:-`. Sourced last so it wins.
source-file -q "$XDG_CONFIG_HOME/tmux/colors.conf"

# theme.sh also writes the terminal palette to every client tty on attach.
# TRAP: `client-attached` misses the session `new-session -A` creates.
# manual → internals/tmux, "Palette delivery".
set-hook -gu client-attached
set-hook -g client-session-changed 'run-shell -b "$HOME/.config/tinted-theming/tinty/theme.sh"'

# ── persistence ──────────────────────────────────────────────
# No tpm: install.sh clones the plugins. manual → internals/tmux, "Persistence".
set -g @resurrect-dir '~/.local/state/tmux/resurrect'
set -g @resurrect-processes '"~nvim->nvim -c \"lua require(\\\"persistence\\\").load()\""'
set -g @resurrect-capture-pane-contents 'off'
set -g @continuum-save-interval '15'
set -g @continuum-restore 'on'

# TRAP: guard and run are ONE sh command (tmux has no `:-`). Continuum LAST.
run-shell 'f="${XDG_DATA_HOME:-$HOME/.local/share}/tmux/plugins/tmux-resurrect/resurrect.tmux"; [ -x "$f" ] && "$f"'
run-shell 'f="${XDG_DATA_HOME:-$HOME/.local/share}/tmux/plugins/tmux-continuum/continuum.tmux"; [ -x "$f" ] && "$f"'

# ── Claude Code in a pane ─────────────────────────────────────
# Shift+Enter as `CSI 13;2u`, only to panes that ask (nushell never does).
# manual → internals/tmux, "Claude Code in a pane".
set -s extended-keys on
set -s extended-keys-format csi-u
