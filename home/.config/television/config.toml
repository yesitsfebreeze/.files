# Television (tv) config. "default" is the builtin tv theme whose colors are
# ANSI names (bright-blue, white, …) with no fixed `background`, so tv
# inherits the terminal's 16 ANSI slots from tinty — the epic's I5: tinty
# owns the palette and no child hardcodes one. The hex themes (gruvbox-dark,
# television, …) bake their palette and never follow the terminal (R6).
[ui]
theme = "default"
# Telescope's shape, in the space the F5 cockpit opens in: preview on top,
# results under it, the input line at the bottom where the cockpit's keys sat.
orientation = "portrait"

[ui.input_bar]
position = "bottom"

[ui.status_bar]
hidden = true
