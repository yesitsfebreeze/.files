[metadata]
name = "dirs"
description = "A channel to select from directories"
requirements = ["fd"]

[source]
command = [
  { name = "normal", run = "fd -t d" },
  { name = "hidden files",  run = "fd -t d --hidden" },
  { name = "gitignored files", run = "fd -t d -I" },
]

[preview]
command = "^ls -la --color=always '{}'"

[keybindings]
shortcut = "f2"

[actions.cd]
description = "Open a shell in the selected directory"
command = "cd '{}'; ^$env.SHELL"
mode = "execute"

[actions.goto_parent_dir]
description = "Re-opens tv in the parent directory"
command = "tv dirs .."
mode = "execute"
