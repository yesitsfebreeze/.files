[metadata]
name = "git-repos"
requirements = ["fd", "git"]
description = """
A channel to select from git repositories on your local machine.

This channel uses `fd` to find directories that contain a `.git` subdirectory, and then allows you to preview the git log of the selected repository.
"""

[source]
# Visible top-level dirs of ~ only: the hidden ones are tool caches, not
# repos you jump to, and walking them took 2 s. --no-global-ignore-file
# because ~/.config/fd/ignore lists `.git/`, which found zero repos.
command = """bash -c 'fd -g .git -H -t d -d 6 --prune --no-global-ignore-file -E node_modules --exec dirname {} \\; -- $(ls -d ~/*/ | grep -vE "/(Library|OrbStack|Applications|Movies|Music|Pictures)/$")'"""
display = "{split:/:-1}"

[preview]
command = "cd '{}'; git log -n 200 --pretty=medium --all --graph --color"

[keybindings]
enter = "actions:cd"
ctrl-e = "actions:edit"

[actions.cd]
description = "Open a new shell in the selected repository"
command = "cd '{}'; ^$env.SHELL"
mode = "execute"

[actions.edit]
description = "Open the repository in editor"
command = "${EDITOR:-vim} '{}'"
shell = "bash"
mode = "execute"
