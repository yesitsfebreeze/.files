# `tv theme` — the curated scheme list (themes.txt via theme.sh --list) as a
# plain tv channel, so F5 s c lists it. Every
# picker (F5 s c, F5 t s, `theme`) opens it in tv-go's fzf look, which previews
# on every focus; tv itself would cache the retint (#969), so no [preview] here.

[metadata]
name = "theme"
description = "curated colour schemes — live preview, enter applies"
requirements = ["tinty"]

[source]
command = "~/.config/tinted-theming/tinty/theme.sh --list"
output = "{}"
no_sort = true
frecency = false
