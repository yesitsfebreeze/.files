# tinty keeps the scheme catalog and records the pick; its hook, theme.sh,
# paints it. manual → internals/tmux, Palette delivery.

default-scheme = "base16-gruvbox-material-dark-medium"
shell = "bash -c '{}'"

[[items]]
name = "tinted-shell"
path = "https://github.com/tinted-theming/tinted-shell"
themes-dir = "scripts"
hook = "\"$HOME/.config/tinted-theming/tinty/theme.sh\""
supported-systems = ["base16", "base24"]
