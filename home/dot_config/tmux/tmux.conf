# tmux.conf — the multiplexer base.
#
# prds/07-multiplexer/01-session-and-windows owns this file: the session
# model, stable window indices, and the terminal-integration floor every
# other child of 07-multiplexer sits on. Later nodes APPEND their own
# sections here and do not edit this one:
#   02-key-tables       F4 / F5 / F6 and their key tables
#   03-status-bar       status-*, window-status-*, pane-border-format
#   04-palette-delivery source-file ~/.config/tmux/colors.conf
#   05-copy-and-clipboard  copy-mode-vi, set-clipboard, the copy sink
#   07-persistence      run-shell of resurrect and continuum
#
# Governed by prds/memos/tmux-owns-multiplexing-wezterm-keeps-the-chrome.md:
# tmux owns windows, panes, addressing, splits, scrollback and the status
# bar; WezTerm keeps only what is true of this machine. Nothing in this file
# may assume WezTerm, macOS, or Homebrew — the whole point is that it is the
# same file on a box reached by ssh ten minutes ago.

# ── the terminal-integration floor ──────────────────────────────────────────

# TERM inside a pane. tmux-256color is the correct answer and is ABSENT on
# plenty of minimal hosts — Debian slim, Alpine, a container built from a
# base image — and a default-terminal naming a terminfo entry that does not
# exist is not a soft failure: tmux refuses to create the session at all.
# So the entry is probed at parse time and screen-256color, which every
# ncurses install carries, is the floor. if-shell in a config file runs
# SYNCHRONOUSLY (verified on tmux 3.7c: the branch is taken before the
# command line's new-session runs), which is what makes this safe to write
# as a conditional rather than a background job that lands too late.
if-shell 'infocmp tmux-256color >/dev/null 2>&1' \
    'set -g default-terminal "tmux-256color"' \
    'set -g default-terminal "screen-256color"'

# Truecolour, for every outer terminal. `*:RGB` is the terminal-features
# spelling; it tells tmux the CLIENT terminal can take direct-colour SGR, so
# a 24-bit colour set inside a pane survives the trip out. Without it every
# palette this environment ships is quantised to 256 colours, which is
# exactly the "colourless on the machine it was meant to improve" failure
# 07-multiplexer exists to avoid.
set -as terminal-features ",*:RGB"

# Undercurl, and coloured undercurl. Neovim draws diagnostics with them and
# terminfo has no standard capability for either, so both are declared as
# overrides against the outer terminal rather than read from its entry.
# Smulx  — the style selector (4:3 is curly)
# Setulc — the underline colour, as direct RGB
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}/%d::%p1%{256}/%%{256}/%d::%p1%{256}%%{256}%d%;m'

# Esc must not lag. tmux waits this long after an Esc for the rest of an
# escape sequence, and anything larger is felt directly as a delay leaving
# insert mode in nvim. 10 ms is high enough to keep function keys whole over
# a slow link. tmux 3.7c already defaults to 10 (it was 500 for years) —
# stated anyway, because the conf must be right on the older tmux that a
# minimal host actually ships.
set -g escape-time 10

# FocusGained / FocusLost must reach the programs inside the panes. nvim's
# autoread checks the file on FocusGained; without this the buffer silently
# goes stale whenever the edit happened outside the pane.
set -g focus-events on

# OSC passthrough: a DCS-wrapped sequence from inside a pane reaches the
# outer terminal. This is the channel 04-palette-delivery's OSC 4/10/11 and
# 05-copy-and-clipboard's OSC 52 both ride, and it is off by default.
#
# It is a WINDOW option, so `-g` here sets the global window default and
# every window created afterwards inherits it.
set -g allow-passthrough on

# ── window and pane addressing ──────────────────────────────────────────────

# Digits address windows and letters address panes (02-key-tables), and a
# keyboard has no 0 next to the 1. Both indices start at 1 so the key and
# the label are the same character.
set -g base-index 1
set -gw pane-base-index 1

# THE reason the WezTerm reconciler dies. Its slot ledger — ~320 lines and
# its own test — existed because WezTerm tab indices shift when a tab
# closes, so a digit was not a stable address without being made one. tmux
# indices are stable natively, and this line is what keeps them that way:
# with renumber-windows on, closing window 4 would slide 5..9 down and every
# digit would address different content. Off is the default; it is stated
# because the entire addressing scheme depends on it.
set -g renumber-windows off

# A window keeps the name it is given. 03-status-bar draws digit-only
# labels, so the rename is invisible there — but the name is what a
# `choose-tree` and any later window picker read.
set -gw automatic-rename on

# ── the session's working directory ─────────────────────────────────────────

# Q14: a lazily created window starts at ~, deliberately NOT the F4 split's
# rule, which does inherit the active pane's cwd.
#
# Measured on tmux 3.7c, with the session path, the pane's cwd and the
# client's cwd all set to DIFFERENT directories — a first reading with two of
# them equal could not tell them apart and got this backwards. `new-window`
# with no `-c` resolves its directory from WHO ran it: the pane's cwd when
# typed into a shell, the client's when run from outside tmux, and THE
# SESSION'S WORKING DIRECTORY when it comes from a key binding. The last is
# the only one anybody presses, since 02-key-tables' `F5 <digit>` is a
# binding.
#
# So the mechanism behind Q14 is the session being CREATED at $HOME, and that
# happens in the launcher (~/.local/bin/tmux-main, `new-session … -c "$HOME"`)
# — this file cannot do it, because tmux has had no `default-path` option
# since 1.9. 02-key-tables' digit binding says `-c ~` as well, so the rule
# still holds against a session somebody else created by hand.

# ── what runs in a pane ─────────────────────────────────────────────────────

# nushell is the host shell (AGENTS.md, scope decisions), and it is named
# here rather than left to default-shell because the passwd shell on this
# machine is /bin/zsh and on a remote is anybody's guess.
#
# THREE things this line must do, and each has cost a day somewhere:
#
#  1. RESOLVE nu ON PATH, never by absolute path. WezTerm's default_prog
#     could hardcode /opt/homebrew/bin because it only ever spawned on this
#     machine; this file is meant to be the same file over ssh, where nu is
#     under ~/.cargo/bin, /usr/local/bin, or nowhere.
#
#  2. FALL BACK, and fall back to something that works. A default-command
#     that fails does not warn — the pane opens and closes again — so a host
#     without nu must land in $SHELL rather than in nothing.
#
#  3. EXPORT XDG_CONFIG_HOME BEFORE THE EXEC. $nu.default-config-dir is a
#     LAUNCH-TIME CONSTANT: env.nu assigning it runs too late to move it.
#     Measured on nushell 0.114.1 (recorded by 02-terminal/06-launchd-path,
#     which learned it the expensive way): with --config/--env-config but no
#     export, $nu.default-config-dir is ~/Library/Application Support/nushell
#     and reedline really does write history.sqlite3 there, outside the
#     managed tree. WezTerm exported it in set_environment_variables; under
#     tmux the pane is spawned by the tmux server, whose environment came
#     from whichever client started it, so the export has to happen here or
#     it happens nowhere.
#
# tmux runs default-command through `/bin/sh -c`, so this is POSIX sh and
# not nushell. `exec` in both arms keeps the pane's process the shell
# itself, which is what makes #{pane_current_command} read `nu` — the value
# 03-status-bar tints occupied windows from.
set -g default-command 'XDG_CONFIG_HOME="${XDG_CONFIG_HOME:-$HOME/.config}"; export XDG_CONFIG_HOME; if command -v nu >/dev/null 2>&1; then exec nu --config "$XDG_CONFIG_HOME/nushell/config.nu" --env-config "$XDG_CONFIG_HOME/nushell/env.nu"; else exec "${SHELL:-/bin/sh}"; fi'

# Carry XDG_CONFIG_HOME across a reattach too. update-environment names the
# variables tmux refreshes in the session from a newly attached client;
# SSH_AUTH_SOCK is already on the default list, which is what keeps the
# agent working after the terminal is restarted, and XDG_CONFIG_HOME joins
# it so a client launched with a different one is not ignored.
set -ga update-environment XDG_CONFIG_HOME

# ── 02-key-tables: F4 split, F5 switch, F6 theme — and nothing in WezTerm ────
#
# prds/07-multiplexer/02-key-tables owns everything below. Three keys, bound
# with `-n` so they need no prefix, which is what makes them feel like
# terminal keys rather than multiplexer keys.
#
# HOW A PUSHED TABLE BEHAVES, measured on 3.7c (probe/notes.md K1, K2) —
# this is the property the whole design rests on and it is not documented
# anywhere obvious:
#
#   A key with no binding in the pushed table is looked up A SECOND TIME in
#   `root`. If root does not bind it either, it is DROPPED — it does not
#   reach the program in the pane. So a mistyped letter cancels the mode and
#   types nothing, which is exactly the behaviour 02-terminal/03-f5-jump-mode
#   R2 demanded and got by binding all 26 letters to a no-op. On this
#   mechanism those binds would be dead code: tmux already does it.
#
#   The same second lookup is why the double-tap needs an explicit binding
#   (Q10). Without `bind -T jump F5 send-keys F5`, the second F5 misses in
#   `jump`, hits `bind -n F5` in `root`, and silently re-arms the table
#   instead of forwarding anything.
#
# No timeout is needed or possible. WezTerm's jump_mode carried a 5 s
# JUMP_TIMEOUT_MS because its key table persisted; a tmux table is popped by
# the very next keystroke whatever it is, so the mode is at most one key deep.

# ── F4 — split, the arrow gives the direction ───────────────────────────────
#
# `-c "#{pane_current_path}"` is the split's cwd rule and it is deliberately
# NOT the digit's: a split inherits where you are (you are dividing this
# work), a lazily created window starts at ~ (Q14 — a digit is a clean
# slate). The two gestures disagree on purpose.
#
# The value behind #{pane_current_path} is the shell's OSC 7, which is why
# config.nu keeps `osc7: true`. Its neighbour `osc133: false` stays off for
# an unrelated and expensive reason — double-marking produced phantom prompt
# lines — and nothing here needs it.
bind -n F4 switch-client -T split
bind -T split Left  split-window -hb -c "#{pane_current_path}"
bind -T split Right split-window -h  -c "#{pane_current_path}"
bind -T split Up    split-window -vb -c "#{pane_current_path}"
bind -T split Down  split-window -v  -c "#{pane_current_path}"
# The double-tap (Q10): F4 F4 puts a literal F4 on the pane's pty, which a
# nested tmux reads as the key. Verified as bytes on the wire, not inferred.
bind -T split F4 send-keys F4

# ── F5 — a digit is a window, a letter is a pane ────────────────────────────
bind -n F5 switch-client -T jump

# Q2, lazy: the digit selects window N, and CREATES it at index N when it is
# absent, so a digit is always a valid address and nothing is respawned in
# the background. The hole left by killing window 4 is not a dead key.
#
# `if-shell -F` tests a FORMAT, so no /bin/sh is spawned per keypress. The
# existence test loops the window list and matches the index inside
# delimiters:
#
#     #{W:|#{window_index}|}   →  |1||4||7|
#
# THE DELIMITER MUST NOT BE A GLOB METACHARACTER. `#{m:}` is fnmatch and `[`
# opens a character class, so the natural `#{m:*[1]*,#{W:[#{window_index}]}}`
# answers TRUE for window **11** when asked about window 1, and the binding
# then selects a window that does not exist. Measured. `|` is inert to
# fnmatch.
#
# `-c ~` on the create arm is belt and braces: the session is created at
# $HOME by ~/.local/bin/tmux-main, and a key-bound `new-window` resolves the
# SESSION's path (01-session-and-windows F14), so this is already ~ for a
# session this repo started. It is stated so the rule also holds against a
# session somebody else created by hand somewhere else.
bind -T jump 1 if-shell -F '#{m:*|1|*,#{W:|#{window_index}|}}' 'select-window -t :1' 'new-window -t :1 -c ~'
bind -T jump 2 if-shell -F '#{m:*|2|*,#{W:|#{window_index}|}}' 'select-window -t :2' 'new-window -t :2 -c ~'
bind -T jump 3 if-shell -F '#{m:*|3|*,#{W:|#{window_index}|}}' 'select-window -t :3' 'new-window -t :3 -c ~'
bind -T jump 4 if-shell -F '#{m:*|4|*,#{W:|#{window_index}|}}' 'select-window -t :4' 'new-window -t :4 -c ~'
bind -T jump 5 if-shell -F '#{m:*|5|*,#{W:|#{window_index}|}}' 'select-window -t :5' 'new-window -t :5 -c ~'
bind -T jump 6 if-shell -F '#{m:*|6|*,#{W:|#{window_index}|}}' 'select-window -t :6' 'new-window -t :6 -c ~'
bind -T jump 7 if-shell -F '#{m:*|7|*,#{W:|#{window_index}|}}' 'select-window -t :7' 'new-window -t :7 -c ~'
bind -T jump 8 if-shell -F '#{m:*|8|*,#{W:|#{window_index}|}}' 'select-window -t :8' 'new-window -t :8 -c ~'
bind -T jump 9 if-shell -F '#{m:*|9|*,#{W:|#{window_index}|}}' 'select-window -t :9' 'new-window -t :9 -c ~'

# Q3: a-i address pane index 1-9. The capability WezTerm refused — I3 forbids
# PaneSelect, so letter addressing there meant self-painting an overlay, and
# all 26 letters sat bound as bare cancels holding this space. Here it is
# nine `select-pane -t`.
#
# tmux RENUMBERS panes when one is killed, so a letter does not keep its pane
# for life. That is why 03-status-bar's `pane-border-format` prints the
# letter: the label is derived from the same index the key uses, so it is
# right the instant after a renumber rather than describing where the pane
# used to be. The letters are only honest WITH that border, and the two nodes
# are one design.
bind -T jump a select-pane -t :.1
bind -T jump b select-pane -t :.2
bind -T jump c select-pane -t :.3
bind -T jump d select-pane -t :.4
bind -T jump e select-pane -t :.5
bind -T jump f select-pane -t :.6
bind -T jump g select-pane -t :.7
bind -T jump h select-pane -t :.8
bind -T jump i select-pane -t :.9

# The double-tap (Q10). See the F4 twin above.
bind -T jump F5 send-keys F5

# ── F6 — theme toggle, and the one key that is never forwarded ──────────────
#
# F6 gets no table and no `send-keys F6` anywhere, deliberately (Q10): the
# palette belongs to the OUTERMOST terminal, because that is the process
# that owns the ANSI colours and reads the OSC. An F6 forwarded into a nested
# session could only retint a session that does not own them.
#
# Bound in the multiplexer rather than in the shell because a full-screen TUI
# would swallow a shell-level binding. `-b` so the tmux server is not blocked
# for the length of a `tinty apply`, which runs a whole hook chain.
#
# `sh -lc` is a LOGIN shell on purpose: /etc/profile runs path_helper, which
# reads /etc/paths.d/homebrew and puts Homebrew's bin on PATH by itself, so
# this file names no Homebrew path and stays the same file on a machine that
# has never heard of it. Measured 2026-08-23, and carried here from
# wezterm.lua when 08-wezterm-reduction moved the binding:
#   env -i HOME=$HOME PATH=/usr/bin:/bin:/usr/sbin:/sbin \
#     /bin/sh -lc 'command -v nu; command -v tinty'
# answers /opt/homebrew/bin/nu, and `tinty: NOT FOUND`. Note what
# /etc/paths.d/homebrew names: `bin` only, never `sbin`. The two
# directories prepended are the ones no login shell adds anywhere — tinty
# lives in ~/.local/bin — and both are $HOME-relative, so they are inert
# where they do not exist. Do NOT drop the prefix on the grounds that `nu`
# resolves without it: the toggle would then fail one layer deeper, on
# `tinty`, where the cause is far harder to see than a missing shell.
bind -n F6 run-shell -b 'PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH" sh -lc '"'"'exec nu -n -c "source $HOME/.config/nushell/theme.nu; _theme_toggle"'"'"''

# ── 05-copy-and-clipboard: copy mode, the c-cycle, and the sink ─────────────
#
# prds/07-multiplexer/05-copy-and-clipboard owns everything below. It ports
# the WezTerm gesture of 02-terminal/04-copy-mode onto tmux's own copy mode
# (epic Q6) and picks the clipboard sink by where the panes are (epic Q14).

# vi keys in copy mode, stated rather than inherited. tmux picks mode-keys
# from $EDITOR/$VISUAL when it is not set, so on a host where EDITOR is
# unset or emacs-shaped the whole c-cycle would sit on top of a table whose
# motions are emacs bindings. The rest of this section names copy-mode-vi
# explicitly, so the option and the table have to agree.
set -gw mode-keys vi

# ── the sink: pbcopy here, OSC 52 anywhere else ─────────────────────────────
#
# pbcopy writes the clipboard of the machine the TMUX SERVER runs on, which
# is the machine the panes are on. That is the right clipboard when the
# server is this desk and the wrong one — or no one at all — when you have
# ssh'd somewhere and started tmux there. OSC 52 is the opposite: it travels
# out through the client's terminal, so it reaches the clipboard of the
# machine you are SITTING at, whatever is in between.
#
# So the branch is `does this machine have pbcopy`, taken once at parse time
# (if-shell in a config file is synchronous — 01-session-and-windows F1).
#
# The two arms are EXCLUSIVE, and that is what `set-clipboard off` buys on
# the local arm: measured on tmux 3.7c, `copy-pipe-and-cancel pbcopy` under
# `set-clipboard on` puts the text on the clipboard AND emits an OSC 52 for
# the same text, so "picks its sink" would have been two sinks. `off` costs
# nothing here: also measured on 3.7c, an OSC 52 written by an APPLICATION
# inside a pane (remote nvim's osc52 provider on the far end of an ssh) is
# forwarded to the outer terminal under off, external and on alike. The
# manual is wrong about that on this version; do not restore `on` locally on
# the strength of the manual page without re-measuring.
#
# The case this gets wrong, named rather than hidden: a tmux server on THIS
# machine attached from somewhere else over ssh copies to this desk's
# clipboard, not to the one in front of you. Copying out is the direction
# this environment is built for; copying in was not bought.
if-shell 'command -v pbcopy >/dev/null 2>&1' {
    set -g @copy-sink pbcopy
    set -s set-clipboard off
} {
    set -g @copy-sink osc52
    set -s set-clipboard on
}

# ── entry ───────────────────────────────────────────────────────────────────
#
# Ctrl+Shift+X, the gesture 02-terminal/04-copy-mode built and Q6 keeps.
#
# THE CONSTRAINT, measured, because it decides whether this key exists at
# all: a terminal cannot express Ctrl+Shift+X in the legacy encoding — both
# Ctrl+X and Ctrl+Shift+X are the single byte 0x18. The key only arrives as
# something distinguishable when the terminal speaks an extended-key
# protocol. tmux 3.7c DECODES both spellings — `CSI 120;6u` (kitty/CSI-u)
# and `CSI 27;6;120~` (xterm modifyOtherKeys) — into `C-S-x`, and it does so
# with `extended-keys` off, on and always alike: that option governs what
# tmux SENDS, never what it accepts.
#
# WezTerm as this repo configures it sends neither, because
# `enable_kitty_keyboard = false` is a matched pair with nushell's
# `use_kitty_protocol = false` (04-shell/01-core-config) and must not be
# flipped. 07-multiplexer/08-wezterm-reduction owes the one-line shim that
# closes the gap — `Ctrl+Shift+X` -> `SendString "\x1b[120;6u"` — in the
# place where the WezTerm copy-mode block is being deleted anyway. Until it
# lands the key works on a terminal that speaks CSI-u natively (kitty,
# Ghostty, foot, WezTerm with the kitty protocol on) and nowhere else, and
# `C-b [` is the entry that works on every terminal ever.
#
# Binding C-S-x costs plain C-x nothing: measured, with only C-S-x bound a
# plain Ctrl+X still reaches the pane as 0x18, so nvim's i_CTRL-X completion
# prefix and every readline binding are untouched. Binding C-x instead — the
# byte that actually arrives on a legacy terminal — would have taken them
# all.
bind -n C-S-x copy-mode

# The cycle position is per pane and lives in @copy-cycle. It is cleared on
# EVERY entry to copy mode, which is what makes an exit by q, Escape or y
# unable to leave it stale — the reason 02-terminal/04-copy-mode R1 gives,
# on a new mechanism. The hook rather than the binding, because copy mode is
# also entered by the mouse wheel and by `copy-mode` typed as a command, and
# a stale toggle on those paths would start the cycle in the middle.
#
# It also guards a real trap: `jump-to-mark` with no mark set does not stay
# put, it moves the cursor to line 2 column 0 (measured). The cycle only
# ever jumps in its `line` state, which is reachable only after the state
# that sets the mark.
set-hook -g after-copy-mode 'set -pu @copy-cycle'

# ── the c-cycle: cell -> word -> line -> cell ───────────────────────────────
#
# One key drives the whole select-and-copy gesture, as it did in WezTerm.
# What is new is that tmux's own selection granularities do the work:
# begin-selection is a cell, select-word is the word under the cursor,
# select-line is the whole line.
#
# THE TRAP, measured: select-word leaves the cursor at the end of the word
# and select-line at the end of the line, so a naive cycle wrapping back to
# cell anchors on wherever the last selection ENDED. On `alpha beta gamma
# delta` with the cursor on `beta`, cell/word/line read b / beta / the whole
# line, and the next `c` without a restore reads `delta`. set-mark on the
# first press records the anchor; `jump-to-mark` then `set-mark` on the wrap
# restores it and puts the mark back (jump-to-mark SWAPS cursor and mark, it
# does not copy), so the cycle returns to the same cell it started from.
#
# The position is tracked in an option rather than by reading the selection
# back, for the reason 04-copy-mode R4 gives and which survives the move: a
# one-cell selection reads #{selection_present} 0 while #{selection_active}
# is 1, so a state machine driven off the selection desyncs on its own first
# step.
bind -T copy-mode-vi c {
    if -F '#{==:#{@copy-cycle},cell}' {
        send -X select-word
        set -p @copy-cycle word
    } {
        if -F '#{==:#{@copy-cycle},word}' {
            send -X select-line
            set -p @copy-cycle line
        } {
            if -F '#{==:#{@copy-cycle},line}' { send -X jump-to-mark }
            send -X set-mark
            send -X clear-selection
            send -X begin-selection
            set -p @copy-cycle cell
        }
    }
}

# y copies and leaves, through whichever sink the branch above chose, and
# only THEN resets the cycle. Everything else in copy-mode-vi is tmux's own
# table, untouched: v / V / C-v, the searches, and every motion.
#
# THE ORDER IS LOAD-BEARING AND THE FAILURE IS SILENT. Measured on tmux
# 3.7c: a `set-option` anywhere in a key binding BEFORE a copy command
# suppresses the OSC 52 that `set-clipboard on` would otherwise emit. The
# paste buffer is still set and `show-buffer` reads the right text, and
# nothing is logged — so on a remote host the copy looks like it worked and
# the clipboard never moves. Three shapes, one fixture:
#
#   { set -pu @o ; send -X copy-selection-and-cancel }   buffer set, NO OSC 52
#   { set -p @o x ; send -X copy-selection-and-cancel }  buffer set, NO OSC 52
#   { send -X copy-selection-and-cancel ; set -pu @o }   buffer set, OSC 52 out
#
# The reset is redundant — after-copy-mode clears the toggle on the next
# entry — and it is kept anyway, because a reader who moves it back to the
# top would otherwise find nothing here saying why it must not be moved.
bind -T copy-mode-vi y {
    if -F '#{==:#{@copy-sink},pbcopy}' \
        'send -X copy-pipe-and-cancel pbcopy' \
        'send -X copy-selection-and-cancel'
    set -pu @copy-cycle
}

# ── 03-status-bar: the bar as tmux draws it ─────────────────────────────────
#
# prds/07-multiplexer/03-status-bar owns everything below. The shape is
# WezTerm's bar ported (Q5, answer 2) and narrowed by Q9: digit-only window
# labels, occupied vs empty carried in the digit's COLOUR, the host on the
# left and the active pane's cwd beside the clock on the right.
#
# Finding T-9 still binds: the F5 legend was removed from that bar as noise
# and does not come back. The bar IS the legend — nine digits in a row say
# what F5 addresses without a word of prose.
#
# COLOURS ARE ANSI SLOTS, NOT HEX. colour0 is base00 and colour7 is base05
# after tinted-shell's OSC 4, so these follow a `tinty apply` for free on any
# terminal that honours it. The one value with no ANSI slot is base02 (the
# active label's background); colour8/base03 stands in until
# 04-palette-delivery's `colors.conf` sets the exact style. Nothing here
# hardcodes a hex value — AGENTS.md's palette rule holds through the move.
set -g status on
set -g status-position top
# 5 s, the WezTerm tick. The clock is HH:MM, so a faster tick would repaint
# the bar sixty times for one visible change — the reason that file gives.
set -g status-interval 5
set -g status-style 'bg=colour0,fg=colour8'
set -g status-left-length 30
set -g status-right-length 60

# ── left: the host, and nothing when you are already on it ──────────────────
#
# Q9: the hostname, dimmed, and blank when local. "Local" cannot be read from
# the format language — tmux does not know where the client is — so it is
# decided once at parse time from the SERVER's environment: a tmux started
# over ssh inherits SSH_CONNECTION, one started from a terminal on this desk
# does not. That is exactly the case the segment exists for, and it costs one
# `if-shell` at load rather than a shell per status tick.
if-shell '[ -n "$SSH_CONNECTION" ]' \
    "set -g status-left '#[fg=colour8] #{host_short} '" \
    "set -g status-left ''"

# ── right: where the active pane is, then the clock ─────────────────────────
#
# `#{s|...|~|:pane_current_path}` is a format substitution, not a shell — no
# process per tick. $HOME is expanded by tmux at parse time here, so the
# pattern is a literal path by the time a tick reads it.
set -g status-right "#[fg=colour8]#{s|^$HOME|~|:pane_current_path}#[fg=colour7]  %H:%M "

# ── the windows: a digit, and its colour says whether anything is running ───
#
# THE OCCUPANCY TEST, ported from wezterm.lua's tab_is_occupied. A window is
# empty when every pane sits at the shell it was spawned with, and occupied
# when at least one is running something else. `#{P:...}` loops the window's
# panes and emits `X` for each pane whose command is not a shell; the outer
# `#{m:*X*,...}` asks whether any pane emitted one.
#
# The membership test reads pattern-first — `#{m:pattern,string}` — so the
# PANE's command becomes the pattern and the shell list is the string. The
# delimiters are `|` for the reason 02-key-tables gives at length: `[` and
# `]` open an fnmatch character class, and the natural bracket form answers
# TRUE for `nushell` when asked about `nu`.
#
# The digit's background says which window has FOCUS and its foreground says
# which windows are BUSY, so the two signals never compete for one channel —
# the same split wezterm.lua made, for the same reason.
set -g window-status-separator ''
set -gw window-status-format '#[fg=#{?#{m:*X*,#{P:#{?#{m:*|#{pane_current_command}|*,|nu|sh|bash|zsh|fish|login|},,X}}},colour7,colour8}]  #I  '
# The ACTIVE label's colours live in an option, not inline in the format:
# base02 is the one value with no ANSI slot, so `colors.conf` has to be able
# to override it, and a style option is a thing a later `source-file` can
# replace while a format's embedded `#[…]` is not.
set -gw window-status-current-format '  #I  '
set -gw window-status-current-style 'bg=colour8,fg=colour15,bold'
set -gw window-status-style 'bg=colour0,fg=colour8'

# ── the pane borders: the letter F5 uses, printed where the pane is ─────────
#
# Q3's other half. tmux renumbers panes when one is killed, so a letter does
# not keep its pane for life; printing the letter DERIVED FROM THE SAME INDEX
# the key uses is what makes `F5 b` honest the instant after a renumber.
#
# `#{a:N}` is the character with numeric value N and `#{e|+|:96,N}` is
# integer addition, so pane 1 (pane-base-index 1) reads `a` and pane 9 reads
# `i`. No shell, no lookup table.
set -gw pane-border-format ' #{a:#{e|+|:96,#{pane_index}}}#{?pane_active,*,} '
set -gw pane-border-style 'fg=colour8'
set -gw pane-active-border-style 'fg=colour7'

# A one-pane window has nothing to address, and a border line there would
# spend a row of the grid saying `a` about the only pane there is. The hook
# fires on every split, kill and layout change, which is every event that can
# change the count.
set -gw pane-border-status off
set-hook -g window-layout-changed 'if -F "#{==:#{window_panes},1}" "setw pane-border-status off" "setw pane-border-status top"'

# Copy mode's selection and the message line, kept on the same slots.
set -gw mode-style 'bg=colour8,fg=colour15'
set -g message-style 'bg=colour8,fg=colour15'

# ── 04-palette-delivery: the scheme, when there is one ──────────────────────
#
# `~/.config/tmux/colors.conf` is written by tinty's tmux-colors.sh hook and
# holds STYLE options only — never formats, so a scheme change can never move
# a segment of the bar. It is sourced LAST, so it overrides the ANSI-slot
# defaults above; a checkout that has never applied a theme has no such file
# and keeps them.
#
# `-q` IS the existence test. The natural spelling —
#   if-shell '[ -f "${XDG_CONFIG_HOME:-$HOME/.config}/tmux/colors.conf" ]' …
# — does not survive: tmux performs its own `${…}` expansion on the string
# and has no `:-` default form, so it rejects the line with "invalid
# environment variable" at load. Measured on 3.7c. `-q` suppresses the
# missing-file error, which is the whole of what the if-shell was for, and
# costs no shell.
#
# Both spellings of the config root are sourced because tmux itself looks in
# both for this very file, and the hook writes to $XDG_CONFIG_HOME. Sourcing
# the same options twice is a no-op; sourcing neither would leave a themed
# machine on the fallback slots.
source-file -q ~/.config/tmux/colors.conf
source-file -q "$XDG_CONFIG_HOME/tmux/colors.conf"

# ── 07-persistence: resurrect and continuum, cloned not tpm'd ───────────────
#
# Q7 and Q11. `new-session -A -s main` already outlives the terminal; it does
# not outlive the machine, because the server dies with it. These two bring
# the layout, the cwds and the editors back after a reboot.
#
# NO tpm. tpm exists to install and update plugins and to give a config a
# place to declare them; install.sh clones them and the two `run-shell` lines
# below declare them, so tpm would be a third mechanism doing a finished job.
# The clone path is install.sh's `$TMUX_PLUGIN_DIR` and the two files must
# agree — tests/tmux-persistence.sh asserts the agreement rather than
# trusting these two comments to stay in step.
#
# `-b` is NOT used: a plugin's init has to have run before the options it
# reads are used, and continuum's is what schedules the save loop.

# Where the saved state lives. Under $XDG_STATE_HOME, not $XDG_DATA_HOME: a
# session snapshot is state a machine can lose without losing anything you
# chose — the same reason nushell's startdir.txt lives there.
set -g @resurrect-dir '~/.local/state/tmux/resurrect'

# Q12 — layout, cwds and nvim sessions. The nvim half is 06-nvim-session's
# PUBLISHED INTERFACE and is copied from that node verbatim rather than
# re-derived:
#
#   `@resurrect-strategy-nvim 'session'` is NOT used. That strategy restores
#   with `nvim -S` only when a literal `Session.vim` sits in the pane's cwd
#   (strategies/nvim_session.sh, read 2026-08-29) — which would mean writing
#   an untracked file into every working tree the editor was ever opened in.
#   The INLINE strategy takes a custom restore command instead, split on the
#   `->` token in scripts/process_restore_helpers.sh, so persistence.nvim's
#   session file stays in the state directory where it belongs.
set -g @resurrect-processes '"~nvim->nvim -c \"lua require(\\\"persistence\\\").load()\""'

# Pane CONTENTS are not saved. What comes back is the shape of the work —
# where each pane was and what it was running — not a screenshot of its
# scrollback, which would put the output of every command on disk in
# plaintext and grow without bound.
set -g @resurrect-capture-pane-contents 'off'

# Q7 — autosave every 15 minutes, and restore automatically when the server
# starts. Restore-on-start is the half that makes a reboot invisible; without
# it the state is on disk and somebody has to know the key that reads it.
set -g @continuum-save-interval '15'
set -g @continuum-restore 'on'

# THE GUARD AND THE RUN ARE ONE SHELL COMMAND, and that shape is forced.
# The natural spelling —
#   if-shell '[ -f "…/resurrect.tmux" ]' 'run-shell "…/resurrect.tmux"'
# — LOADS SILENTLY AND RUNS NOTHING. `run-shell`'s argument is a tmux
# command string, so tmux performs its own `${…}` expansion on it first and
# has no `:-` default form; the expansion fails, if-shell swallows the error,
# and the plugin never starts with no message anywhere. Measured on 3.7c,
# 2026-08-30. Inside `run-shell '<sh>'` the whole string is handed to /bin/sh
# and `${XDG_DATA_HOME:-$HOME/.local/share}` is the SHELL's expansion, which
# works.
#
# THE `-x` GUARD, and what it is honestly worth. Measured on 3.7c: without
# it, `run-shell` on a missing file produces NO error anywhere — not on
# stderr at load, not in `show-messages`. So the guard does not save you from
# a broken config; it saves you from spawning a shell that fails silently,
# and it states the intent where a reader will find it. A machine where
# install.sh has not run — a remote reached before provisioning — gets a
# fully working tmux either way, minus persistence. That is the honest
# degradation, and it is why nothing here aborts.
run-shell 'f="${XDG_DATA_HOME:-$HOME/.local/share}/tmux/plugins/tmux-resurrect/resurrect.tmux"; [ -x "$f" ] && "$f"'

# CONTINUUM GOES LAST, and that is a documented requirement of the plugin,
# not a style preference: its init reads the @continuum-* options and
# schedules the save loop, so anything set after it is not seen by the loop
# it started.
run-shell 'f="${XDG_DATA_HOME:-$HOME/.local/share}/tmux/plugins/tmux-continuum/continuum.tmux"; [ -x "$f" ] && "$f"'
