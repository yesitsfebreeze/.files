# tmux.conf — the multiplexer base. tmux owns windows, panes, addressing,
# splits, scrollback, the status bar. 07-multiplexer I1: every gesture works on
# a bare server with no WezTerm. Each TRAP is one line; manual → internals/tmux.

# ── terminal integration ─────────────────────────────────────────
# TRAP: a machine without tmux-256color refuses the session on the first
# line below. manual → internals/tmux, "The terminal-integration floor".
set -g default-terminal "tmux-256color"
# `sync` wraps every redraw in DEC 2026, so WezTerm shows a finished frame:
# without it a pane header is visibly erased then rewritten on each redraw.
# `usstyle`: a hand-written Setulc string printed its own operands ("256/256{")
# into the pane when a byte was off; this is tmux's own undercurl+colour cap.
# `extkeys` is for Claude Code's Shift+Enter (see "Claude Code in a pane").
# TRAP: indexed `set`, never `set -a`: every reload appends again, and the list
# had grown to 76 entries.
set -s terminal-features[3] '*:RGB:hyperlinks:usstyle:sync'
set -s terminal-features[4] 'xterm*:extkeys'
set -g escape-time 10
set -g focus-events on
set -g mouse on

# On: theme.sh and font.sh reach the terminal as passthrough from a pane, so
# tmux sends them between its own escape sequences instead of mid-sequence.
set -gw allow-passthrough on

# ── where a pane actually is ────────────────────────────────────
# `#{E:@cwd}` is the pane's REAL working directory — every gesture meaning
# "here" uses it. TRAP: `pane_current_path` is the process's OS cwd, which
# nushell never moves, so it answers where the pane STARTED; `pane_path` is
# the OSC 7 report, a URL.
# TRAP in the strip: `#{s|a|b|:v}` splits on the FIRST `:` (hence `file.//`),
# an EMPTY replacement yields "", `#{m|..|..}` is not parsed. TRAP in the
# guard: an OSC 7 naming another host is an ssh pane, not trusted. 2026-09-01
# on 3.7c. manual → internals/tmux, "Where a split starts".
set -g @cwd '#{?#{m:file://#{host}/*,#{pane_path}},#{s|^file.//[^/]*/|/|:pane_path},#{pane_current_path}}'

# ── addressing: digits are windows, letters are panes ───────────────────
set -g base-index 1
set -gw pane-base-index 1

# TRAP: `on` slides 5..9 down when window 4 closes and every digit then addresses
# different content. manual → "`renumber-windows off` is the whole scheme".
set -g renumber-windows off
set -gw automatic-rename on

# ── what runs in a pane ─────────────────────────────────────────
# TRAP: XDG_CONFIG_HOME exported BEFORE the exec, nu resolved on PATH never
# absolutely, $SHELL fallback so a broken nu does not close the pane. manual →
# internals/tmux, "`default-command`: three things, each of which cost a day".
set -g default-command 'XDG_CONFIG_HOME="${XDG_CONFIG_HOME:-$HOME/.config}"; export XDG_CONFIG_HOME; if command -v nu >/dev/null 2>&1; then exec nu --config "$XDG_CONFIG_HOME/nushell/config.nu" --env-config "$XDG_CONFIG_HOME/nushell/env.nu"; else exec "${SHELL:-/bin/sh}"; fi'
set -ga update-environment XDG_CONFIG_HOME

# ── F5 — a digit is a window, a letter a pane, an arrow splits, q closes ──
# Stock tmux cannot paint text over a pane, so the letters live on the pane
# border below. manual → internals/tmux, "Pane letters are only honest with the border".
bind -n F5 switch-client -T jump

# TRAP: one-shot — any key not rearmed below falls to root and ends the
# switcher, an unbound key included; this line is why a second F5 does not.
# manual → internals/tmux, "A pushed table falls back to `root`, then drops".
bind -T jump F5 send-keys F5
bind -T jump      Escape switch-client -T root
bind -T jump-pane Escape switch-client -T root

# R2: this digit+letter table (27 binds) is generated, not hand-written. TRAP:
# `run-shell`'s argument is format-expanded BEFORE the shell sees it, so a
# literal `#{...}` needs `##{...}`, and chaining two commands onto one key needs
# `\;` as one argv token. manual → internals/tmux, "Key tables".
run-shell '\
i=1; letters="abcdefghi"; \
while [ "$i" -le 9 ]; do \
    l=$(printf "%s" "$letters" | cut -c"$i"); \
    tmux bind-key -T jump "$i" if -F "##{m:*|$i|*,##{W:|##{window_index}|}}" \
        "select-window -t :$i" "new-window -t :$i -c ~" "\;" \
        if -F "##{==:##{window_panes},1}" "switch-client -T root" "switch-client -T jump-pane"; \
    tmux bind-key -T jump "$l" select-pane -t ":.$i"; \
    tmux bind-key -T jump-pane "$l" select-pane -t ":.$i"; \
    i=$((i + 1)); \
done'

# Arrows walk panes and re-arm `jump`, so a walk is one F5.
bind -T jump Left    { select-pane -L ; switch-client -T jump }
bind -T jump Right   { select-pane -R ; switch-client -T jump }
bind -T jump Up      { select-pane -U ; switch-client -T jump }
bind -T jump Down    { select-pane -D ; switch-client -T jump }

# Ctrl+arrow picks the pane up: it swaps with its neighbour and enters
# `pane-move`, where every arrow keeps carrying it until Escape or Enter.
# `-d` keeps focus on the moved pane — without it focus stays on the slot.
# TRAP: macOS takes Ctrl+Left/Right for Spaces; off in Mission Control settings.
bind -T jump      C-Left  { swap-pane -d -t '{left-of}'  ; switch-client -T pane-move }
bind -T jump      C-Right { swap-pane -d -t '{right-of}' ; switch-client -T pane-move }
bind -T jump      C-Up    { swap-pane -d -t '{up-of}'    ; switch-client -T pane-move }
bind -T jump      C-Down  { swap-pane -d -t '{down-of}'  ; switch-client -T pane-move }
bind -T pane-move Left    { swap-pane -d -t '{left-of}'  ; switch-client -T pane-move }
bind -T pane-move Right   { swap-pane -d -t '{right-of}' ; switch-client -T pane-move }
bind -T pane-move Up      { swap-pane -d -t '{up-of}'    ; switch-client -T pane-move }
bind -T pane-move Down    { swap-pane -d -t '{down-of}'  ; switch-client -T pane-move }
bind -T pane-move C-Left  { swap-pane -d -t '{left-of}'  ; switch-client -T pane-move }
bind -T pane-move C-Right { swap-pane -d -t '{right-of}' ; switch-client -T pane-move }
bind -T pane-move C-Up    { swap-pane -d -t '{up-of}'    ; switch-client -T pane-move }
bind -T pane-move C-Down  { swap-pane -d -t '{down-of}'  ; switch-client -T pane-move }
bind -T pane-move Escape  switch-client -T root
bind -T pane-move Enter   switch-client -T root

# Shift+arrow splits and ends the switcher. `Left`/`Up` go before the current
# pane; a split inherits the cwd and a lazy window starts at ~, on purpose.
bind -T jump S-Left  split-window -hb -c "#{E:@cwd}"
bind -T jump S-Right split-window -h  -c "#{E:@cwd}"
bind -T jump S-Up    split-window -vb -c "#{E:@cwd}"
bind -T jump S-Down  split-window -v  -c "#{E:@cwd}"

# TRAP: only in `jump`, never `jump-pane` — after a digit `q` is a word's
# first letter, not a close. manual → internals/tmux, "Key tables".
bind -T jump q kill-pane

# Q1, answered 2026-09-02: the pane letter stays on every border, always.

# ── F3 — search: type the query, then pick the channel (tv-go find) ──────
# tmux, not the shell, so it fires inside nvim or a Claude pane; `%1` is the
# query from command-prompt, whose Escape cancels silently.
# TRAP: `display-popup -e` is never format-expanded — wrap in `run-shell` with
# a `{}` block (a backslash-continued one parses and never fires, 3.7c).
# TRAP: `-B` — tv draws its own frame; a tmux border beside it tears.
bind -n F3 command-prompt -p 'search' {
    run-shell "tmux display-popup -E -B -w 90% -h 85% -x C -y C -d '#{E:@cwd}' -e 'TV_ALL_ORIGIN=#{pane_id}' '~/.local/bin/tv-go find %1'"
}

# A root binding is taken by the OUTERMOST server: `F5 F3` sends a literal F3.
bind -T jump F3 send-keys F3

# ── F6 — theme toggle, never forwarded to a nested session ──────────────
# Straight to bash, no `sh -l` and no nu: each exec costs ~80 ms here, and the
# server PATH already carries /opt/homebrew/bin, where tinty lives.
# `> /dev/null`: run-shell pops up anything on stdout over the panes; stderr
# stays, because a broken tinty earns its popup.
bind -n F6 run-shell -b '"$HOME/.config/tinted-theming/tinty/theme.sh" --toggle > /dev/null'

# ── F8 / F7 / F9 — the tv overlay ────────────────────────────────────────
# F8: pick a channel, then a row, and act on it (tv-go). F7: the same, but the
# row is typed into this pane. F9 goes straight to the theme channel: moving
# retints everything, Enter keeps the pick as this mode's scheme, Esc repaints
# the current one. `-B`: tv draws its own frame (see F3).
# `run-shell` wraps each for `#{pane_id}`: display-popup -e never expands it.
bind -n F8 run-shell "tmux display-popup -E -B -w 90% -h 85% -x C -y C -d '#{E:@cwd}' -e 'TV_ALL_ORIGIN=#{pane_id}' '~/.local/bin/tv-go act'"
bind -n F7 run-shell "tmux display-popup -E -B -w 90% -h 85% -x C -y C -d '#{E:@cwd}' -e 'TV_ALL_ORIGIN=#{pane_id}' '~/.local/bin/tv-go type'"
bind -n F9 run-shell "tmux display-popup -E -B -w 80% -h 80% -x C -y C -e 'TV_ALL_ORIGIN=#{pane_id}' '~/.local/bin/tv-go act theme'"

# ── copy mode ────────────────────────────────────────────────
# Stated, not inherited — tmux picks mode-keys from $EDITOR when unset.
set -gw mode-keys vi

# TRAP: naming the sink is not enough, and this is the bug that shipped. EVERY
# stock copy path calls `copy-pipe-and-cancel` with NO command, filling tmux's
# own buffer and stopping — the text looks copied and Cmd+V still pastes what
# was there before; only `y` named a sink (2026-09-01). So the sink is an
# OPTION every path names, expanded by `send -FX`. manual → internals/tmux,
# "Choosing the sink is not the same as using it".
set -g @copy-pipe 'pbcopy'
set -s set-clipboard off

# A plain function key asks nothing of the terminal; a Ctrl+Shift chord would
# arrive as its plain Ctrl byte. manual → internals/tmux, "`F4`, and the chord it replaced".
bind -n F4 copy-mode

# An inner tmux can never see F4 on its own.
bind -T jump F4 send-keys F4

# R3: the hand-rolled `c` cell/word/line cycle and `@copy-cycle` are gone. TRAP
# for the next reader: `v` is rectangle-toggle, NOT begin-selection (`Space` is),
# and tmux has no `viw` — a word in one key is the double-click below. `y`
# names the sink because stock binds it sinkless.
bind -T copy-mode-vi y send -FX copy-pipe-and-cancel "#{@copy-pipe}"

# `Enter` opens a link under the cursor instead of copying, if one is there —
# an OSC 8 hyperlink first (`#{copy_cursor_hyperlink}`, what tmux itself
# tracks), else a plain-text URL found the same way Space's word rung finds a
# word. Either way the browser gets it and copy mode ends, matching what
# Enter already did for everything else. Falls through to the ordinary
# copy-and-cancel when the cursor is on neither.
bind -T copy-mode-vi Enter run-shell -b '~/.local/bin/tmux-copy-open-link "#{pane_id}"'

# Ctrl+C copies a selection, leaves without one — stock binds it to `cancel`
# unconditionally, so drag-then-Ctrl+C threw the selection away.
bind -T copy-mode-vi C-c if -F '#{selection_present}' \
    'send -FX copy-pipe-and-cancel "#{@copy-pipe}"' \
    'send -X cancel'

# Stock binds Escape to `clear-selection` full stop — vi-accurate, but there
# is no normal mode to be left in, so a selectionless Escape did nothing.
bind -T copy-mode-vi Escape if -F '#{selection_present}' \
    'send -X clear-selection' \
    'send -X cancel'

# `w` is the word END. TRAP measured on 3.7c: stock `next-word` wraps onto the
# following line; `next-word-end` never leaves the line it is on — at the last
# word end it parks. `e` still means the same thing.
bind -T copy-mode-vi w send -X next-word-end

# Selection by unit, nothing pressed first: move, then `p` takes the
# paragraph and leaves it selected; `y`/`Enter`/`Ctrl+C` copy. Shift (`W`,
# `L`, `P`) takes one unit, copies and leaves. TRAP: after `select-word` a
# motion grows by whole words, even backwards (3.7c) — widen with `p`.

# `Space` widens: one word per press onto whichever side has room, then
# whole lines, stopping at a blank line; repeats from the same cursor
# position. tmux has no widen primitive, hence the script.
# manual → internals/tmux, "`Space` widens the selection".
bind -T copy-mode-vi Space run-shell -b '~/.local/bin/tmux-copy-expand "#{pane_id}"'

# A motion during an open selection would EXTEND it, so `hjkl` and the arrows
# clear first: a stray step means "start over", and the next `Space` restarts
# at a word. `w`, `b`, `g`/`G` keep their own selecting twins above.
bind -T copy-mode-vi h send -X clear-selection \; send -X cursor-left
bind -T copy-mode-vi j send -X clear-selection \; send -X cursor-down
bind -T copy-mode-vi k send -X clear-selection \; send -X cursor-up
bind -T copy-mode-vi l send -X clear-selection \; send -X cursor-right
bind -T copy-mode-vi Left  send -X clear-selection \; send -X cursor-left
bind -T copy-mode-vi Down  send -X clear-selection \; send -X cursor-down
bind -T copy-mode-vi Up    send -X clear-selection \; send -X cursor-up
bind -T copy-mode-vi Right send -X clear-selection \; send -X cursor-right
bind -T copy-mode-vi W {
    send -X select-word
    send -FX copy-pipe-and-cancel "#{@copy-pipe}"
}
bind -T copy-mode-vi L send -FX copy-pipe-end-of-line-and-cancel "#{@copy-pipe}"

# TRAP: no `select-paragraph`, and extending with `next-paragraph`
# mis-anchors (3.7c), so `p` always takes the WHOLE paragraph; the guards
# drop the blank separator line each motion lands on.
bind -T copy-mode-vi p {
    send -X clear-selection
    send -X previous-paragraph
    if -F '#{==:#{copy_cursor_line},}' { send -X cursor-down }
    send -X begin-selection
    send -X next-paragraph
    if -F '#{==:#{copy_cursor_line},}' { send -X cursor-up ; send -X end-of-line }
}
bind -T copy-mode-vi P {
    send -X clear-selection
    send -X previous-paragraph
    if -F '#{==:#{copy_cursor_line},}' { send -X cursor-down }
    send -X begin-selection
    send -X next-paragraph
    if -F '#{==:#{copy_cursor_line},}' { send -X cursor-up ; send -X end-of-line }
    send -FX copy-pipe-and-cancel "#{@copy-pipe}"
}

# `F4 s` — the session id this pane already printed, staged as a `cr` line.
# Press it again for the next-older one; it cycles. `s` and not `c`: `c` is the
# key the widening selection cycle held, and a hand that reaches for it is
# reaching to start a copy. TRAP: copy mode has to be cancelled FIRST, because a
# pane in a mode swallows `send-keys` and there is no route from inside the mode
# to the shell. manual → terminal, `F4 s`.
bind -T copy-mode-vi s send -X cancel \; run-shell -b '~/.local/bin/tmux-claude-resume "#{pane_id}"'

# ── the mouse copies too ────────────────────────────────────────
# `mouse on` had to move selection into tmux — a terminal-level drag across a
# split grabs both panes' columns as one line — so tmux owes it a clipboard, and
# `mouse_any_flag` leaves a mouse-tracking program its own clicks.
# manual → internals/tmux, "Taking the mouse means owing it a clipboard".
bind -T copy-mode-vi MouseDragEnd1Pane send -FX copy-pipe-and-cancel "#{@copy-pipe}"
bind -n DoubleClick1Pane select-pane -t = \; if -F '#{||:#{pane_in_mode},#{mouse_any_flag}}' \
    { send -M } \
    { copy-mode -H ; send -X select-word ; run-shell -d 0.3 ; send -FX copy-pipe-and-cancel "#{@copy-pipe}" }
bind -n TripleClick1Pane select-pane -t = \; if -F '#{||:#{pane_in_mode},#{mouse_any_flag}}' \
    { send -M } \
    { copy-mode -H ; send -X select-line ; run-shell -d 0.3 ; send -FX copy-pipe-and-cancel "#{@copy-pipe}" }

# ── status bar ───────────────────────────────────────────────
# Colours are ANSI slots, never hex, so a `tinty apply` retints them free.
# One row: clock, CPU/memory gauges and network rate (`tmux-sys`, fixed width
# so nothing after it moves), window digits. Per-pane facts live in the pane headers.
# manual → internals/tmux, "The status bar".
set -g status on
set -g status-position top
set -g status-interval 5
set -g status-style 'bg=colour0,fg=colour8'
set -g status-left-length 120
set -g status-right-length 0

# Window digits sit top-RIGHT, over the edge each pane prints its letter on, so
# both halves of the F5 address read from one corner. TRAP: `right` only reaches
# the terminal's edge while `status-right` is EMPTY.
set -g status-justify right
set -g status-right ''

# The clock anchors the corner: its width is the only one that never changes.
# The key-table chip is F5's only feedback. TRAP for anyone re-measuring it: a
# REAL keypress redraws the status, but `switch-client -T jump` from the CLI
# does not, so the chip waits a tick and reads exactly like a broken format.
set -g status-left '#[fg=colour7] %H:%M #[fg=colour8] #(~/.local/bin/tmux-sys) #{?#{!=:#{client_key_table},root},#[reverse] #{client_key_table} #[default],}'

# The pane headers below carry the per-pane detail; the bar stays one row.
# The git segment is there rather than left to starship because the prompt is
# only on screen while a pane sits AT one — open nvim and the branch is gone.
# The host rides there because over ssh the host and the path are one fact.
# TRAP: `$HOME` expands at parse time in DOUBLE quotes only and `#(...)` needs
# its own quotes, so inside a `"…'…'…"` if-shell arm neither is free — hence
# `@host`, set in the arm, with the format written ONCE at top level.
# TRAP: `:...` names a VARIABLE, so `#{s|^$HOME|~|:@cwd}` substitutes over the
# option's literal text and `:E:@cwd` yields "" — hence the cwd spelled out
# below. Keep it in step with `@cwd`.
set -g @host ''
if-shell '[ -n "$SSH_CONNECTION" ]' 'set -g @host "#{host_short}  "'

# Background says which window has focus, foreground what Claude is doing in
# it: colour3 waiting for you, colour4 working, colour2 finished, unlit when no
# Claude has reported. `~/.local/bin/tmux-claude-state` sets `@claude` on the
# PANE from a Claude Code hook and `#{P:…}` gathers a window's panes at draw
# time, so nothing is stored per window and no count can go stale. Waiting wins
# over working, because it is the one state that is asking for a human.
# TRAP: `#{E:…}` is what expands an option holding a format, and a `#[fg=…]`
# arriving from one IS honoured by the bar (2026-09-02 on 3.7c). TRAP: `#{P:…}`
# takes TWO comma-separated arguments, so a top-level comma inside it splits it;
# every comma below is nested inside a `#{?…}` and safe.
set -g @claude-tint '#{?#{m:*waiting*,#{P:#{@claude}}},#[fg=colour3],#{?#{m:*working*,#{P:#{@claude}}},#[fg=colour4],#{?#{m:*done*,#{P:#{@claude}}},#[fg=colour2],}}}'
set -g window-status-separator ''
set -gw window-status-format '#[fg=colour8]#{E:@claude-tint} #I '
set -gw window-status-current-format '#{E:@claude-tint} #I '

# A style option, not inline in the format, so colors.conf can override it.
set -gw window-status-current-style 'bg=colour8,fg=colour15,bold'
set -gw window-status-style 'bg=colour0,fg=colour8'

# Each pane's top border is its header: plain text on the border line, like a
# popup's title — jump letter (F5 a..i), host over ssh, OSC 7 directory, git,
# zoom and copy/view mode. No fills, no reverse video: focus is the accent
# colour of the border itself, so a header repaint is a repaint of text only.
set -gw pane-border-format " #{a:#{e|+|:64,#{pane_index}}}  #{E:@host}#{?#{m:file://#{host}/*,#{pane_path}},#{s|^file.//[^/]*/|/|;s|^$HOME|~|:pane_path},#{s|^$HOME|~|:pane_current_path}} #(~/.local/bin/tmux-git '#{E:@cwd}')#{?window_zoomed_flag, zoom,}#{?pane_in_mode, #{pane_mode},} "
set -gw pane-border-style 'fg=colour8'
set -gw pane-active-border-style 'fg=colour4'

# Stock pane borders are straight; rounded is a popup-only style.
set -gw pane-border-lines single
set -gw pane-border-status top
set-hook -gu window-layout-changed

# Pane contents keep the terminal colours regardless of focus.
# Focus is shown by the title; neither pane style overrides content colours.
set -gw window-style 'default'
set -gw window-active-style 'default'
set -gw mode-style 'bg=colour8,fg=colour15'
set -g message-style 'bg=colour8,fg=colour15'

# ── palette ──────────────────────────────────────────────────
# TRAP: `-q` IS the existence test — an if-shell here fails at load, since
# tmux does its own ${...} expansion and has no `:-`. Sourced last so it wins.
source-file -q "$XDG_CONFIG_HOME/tmux/colors.conf"

# That conf dresses tmux's OWN surfaces; the terminal's palette is a separate
# wire, so theme.sh also writes OSC 4/10/11/12 to every `#{client_tty}` on
# attach. `-b` so a slow disk cannot hold the attach.
# TRAP: `client-attached` does not fire when `new-session -A` CREATES the
# session (first window after a server start); `client-session-changed` fires
# on both paths — measured on 3.7c.
set-hook -gu client-attached
set-hook -g client-session-changed 'run-shell -b "$HOME/.config/tinted-theming/tinty/theme.sh"'

# ── persistence ──────────────────────────────────────────────
# No tpm: install.sh clones the plugins, the two run-shell lines below
# declare them. manual → internals/tmux, "Persistence".
set -g @resurrect-dir '~/.local/state/tmux/resurrect'

# Inline strategy, not 'session': that one needs a Session.vim in every cwd.
set -g @resurrect-processes '"~nvim->nvim -c \"lua require(\\\"persistence\\\").load()\""'
set -g @resurrect-capture-pane-contents 'off'
set -g @continuum-save-interval '15'
set -g @continuum-restore 'on'

# TRAP: guard and run must be ONE sh command — an if-shell wrapper loads
# silently and runs nothing, since tmux expands ${...} itself and has no `:-`.
# Continuum LAST: its init reads the @continuum-* options above.
run-shell 'f="${XDG_DATA_HOME:-$HOME/.local/share}/tmux/plugins/tmux-resurrect/resurrect.tmux"; [ -x "$f" ] && "$f"'
run-shell 'f="${XDG_DATA_HOME:-$HOME/.local/share}/tmux/plugins/tmux-continuum/continuum.tmux"; [ -x "$f" ] && "$f"'

# ── Claude Code in a pane ─────────────────────────────────────
# Shift+Enter inserts a newline instead of submitting. Safe against the
# use_kitty_protocol=false pairing: tmux only sends extended keys to a pane that
# asks, and nushell never asks. manual → internals/tmux, "Claude Code in a pane".
set -s extended-keys on
# CSI-u rather than xterm's modifyOtherKeys: pi refuses to start on the xterm
# spelling, and tmux 3.7c decodes both on the way in, so only what it sends to
# a pane changes. Shift+Enter reaches a requesting pane as `CSI 13;2u`.
set -s extended-keys-format csi-u
