# tmux.conf — the multiplexer base.
#
# tmux owns windows, panes, addressing, splits, scrollback and the status bar;
# WezTerm keeps only what is true of this machine. Nothing here may assume
# WezTerm, macOS or Homebrew.
#
# 07-multiplexer I1 — EVERY gesture in this file works on a bare server with no
# WezTerm: over ssh, on a console, under an emulator nobody has configured. A
# binding that needs the emulator to negotiate a protocol, or a helper only
# this desk has, is not portable and does not belong here. Where a capability
# genuinely has two implementations, the choice is made at load time by probing
# for the thing (`command -v`, `infocmp`) — never by assuming the terminal.
#
# Why any of this is shaped the way it is: manual → internals/tmux.
# Read it before changing a line marked TRAP.

# ── terminal integration ────────────────────────────────────────────────────

# TRAP: a default-terminal naming an absent terminfo entry makes tmux refuse
# to create the session. tmux-256color is missing on minimal hosts.
if-shell 'infocmp tmux-256color >/dev/null 2>&1' \
    'set -g default-terminal "tmux-256color"' \
    'set -g default-terminal "screen-256color"'

set -as terminal-features ",*:RGB"
# OSC 8 hyperlinks: off by default, tmux swallows them, and then WezTerm has
# no link at the cursor to open on shift-click. Requires the outer terminal
# to support OSC 8; harmless where it doesn't.
set -as terminal-features ",*:hyperlinks"
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}/%d::%p1%{256}/%%{256}/%d::%p1%{256}%%{256}%d%;m'
set -g escape-time 10
set -g focus-events on
set -g mouse on

# The channel OSC 4/10/11 and OSC 52 both ride. Off by default.
set -g allow-passthrough on

# ── where a pane actually is ────────────────────────────────────────────────
#
# `#{E:@cwd}` is the pane's REAL working directory. Use it anywhere a gesture
# means "here" — a split, a popup's scope, the status bar. Never
# `#{pane_current_path}` on its own.
#
# TRAP: `#{pane_current_path}` is the pane process's OS cwd, and nushell never
# changes it. `cd` in nushell moves `$env.PWD` and leaves the process where it
# was launched, so the format answers the directory the pane STARTED in — which
# is why a split used to open in a directory you had left long ago. Measured
# 2026-09-01 on tmux 3.7c: a pane whose prompt was in ~/dev/dotfiles reported
# `pane_current_path=/Users/feb/dev/infra/pearde`.
#
# `#{pane_path}` is the OSC 7 report instead, which nushell emits on every
# prompt (`config.nu` keeps `osc7: true` for exactly this). It is a URL —
# `file://<host><path>` — so the host has to come off.
#
# Three traps in the format itself, all measured on 3.7c:
#   * `#{s|a|b|:var}` splits on the FIRST `:`, so a literal `:` in the pattern
#     truncates it and the whole thing yields "". `file.//` matches `file://`
#     with `.` standing in for the colon.
#   * An EMPTY replacement also yields "" rather than the stripped string, so
#     the host is replaced by the `/` that follows it, not deleted.
#   * `#{m:...}` wants its comma form; `#{m|...|...}` is not parsed and comes
#     back as literal text.
#
# The `m:` guard is the ssh case: a pane logged into another box reports THAT
# box's path, which does not exist here. Only an OSC 7 naming this host is
# trusted; anything else falls back to the process cwd, which for an ssh pane
# is the local one and is the right answer.
set -g @cwd '#{?#{m:file://#{host}/*,#{pane_path}},#{s|^file.//[^/]*/|/|:pane_path},#{pane_current_path}}'

# ── addressing: digits are windows, letters are panes ───────────────────────

set -g base-index 1
set -gw pane-base-index 1

# TRAP: the whole addressing scheme depends on this. `on` would slide 5..9
# down when window 4 closes and every digit would address different content.
set -g renumber-windows off

set -gw automatic-rename on

# ── what runs in a pane ─────────────────────────────────────────────────────

# TRAP: XDG_CONFIG_HOME must be exported BEFORE the exec — nu's
# default-config-dir is a launch-time constant, and env.nu runs too late to
# move it. Resolve nu on PATH, never absolutely; fall back to $SHELL, because
# a default-command that fails just closes the pane with no message.
set -g default-command 'XDG_CONFIG_HOME="${XDG_CONFIG_HOME:-$HOME/.config}"; export XDG_CONFIG_HOME; if command -v nu >/dev/null 2>&1; then exec nu --config "$XDG_CONFIG_HOME/nushell/config.nu" --env-config "$XDG_CONFIG_HOME/nushell/env.nu"; else exec "${SHELL:-/bin/sh}"; fi'
set -ga update-environment XDG_CONFIG_HOME

# No overlay helper. Stock tmux cannot paint custom text over a pane:
# display-panes draws only the pane index (as clock glyphs), and a popup is
# one per client and eats every key while it is up — an earlier experiment
# patched the tmux binary to get a letter-only indicator, and was retired.
# The letters live on the pane border instead (pane-border-format below):
# always visible, so they are honest inside the switcher and out of it.
bind -n F5 switch-client -T jump

# ── F5 — a digit is a window, a letter a pane, an arrow splits, q closes ───

# switch-client -T is one-shot: after one key tmux falls back to root, so a
# binding that does NOT re-arm is what ends the switcher. That is the whole
# gesture — press F5, then one key, or two, and you are back in the pane
# typing. A letter, an arrow and `q` are complete on their own and exit. A
# digit is complete only when the window it lands on has a single pane; when
# the window has more, the pane letter is still to come, so the digit arms
# `jump-pane` and waits for it. `F5 1 b` is two keys and no Escape.
#
# An unbound key is looked up once more in root and, missing there too, is
# DROPPED — it does not reach the pane. So anything the switcher does not use
# ends the mode and costs the keystroke; that is also why Escape is bound in
# both tables rather than left to fall through, since a bound key is the only
# one guaranteed not to reach the program in the pane.

# Without this the second F5 falls back to root and re-arms the table.
bind -T jump F5 send-keys F5

bind -T jump      Escape switch-client -T root
bind -T jump-pane Escape switch-client -T root

# A split inherits the pane's cwd; a lazily created window starts at ~. The
# two gestures disagree on purpose.
#
# The trailing `if` is the stay-or-leave test, read AFTER the select: the
# window is the one you just landed on. `==` rather than `>` because string
# equality is the comparison this file already leans on.

bind -T jump 1 if -F '#{m:*|1|*,#{W:|#{window_index}|}}' 'select-window -t :1' 'new-window -t :1 -c ~' \; if -F '#{==:#{window_panes},1}' 'switch-client -T root' 'switch-client -T jump-pane'
bind -T jump 2 if -F '#{m:*|2|*,#{W:|#{window_index}|}}' 'select-window -t :2' 'new-window -t :2 -c ~' \; if -F '#{==:#{window_panes},1}' 'switch-client -T root' 'switch-client -T jump-pane'
bind -T jump 3 if -F '#{m:*|3|*,#{W:|#{window_index}|}}' 'select-window -t :3' 'new-window -t :3 -c ~' \; if -F '#{==:#{window_panes},1}' 'switch-client -T root' 'switch-client -T jump-pane'
bind -T jump 4 if -F '#{m:*|4|*,#{W:|#{window_index}|}}' 'select-window -t :4' 'new-window -t :4 -c ~' \; if -F '#{==:#{window_panes},1}' 'switch-client -T root' 'switch-client -T jump-pane'
bind -T jump 5 if -F '#{m:*|5|*,#{W:|#{window_index}|}}' 'select-window -t :5' 'new-window -t :5 -c ~' \; if -F '#{==:#{window_panes},1}' 'switch-client -T root' 'switch-client -T jump-pane'
bind -T jump 6 if -F '#{m:*|6|*,#{W:|#{window_index}|}}' 'select-window -t :6' 'new-window -t :6 -c ~' \; if -F '#{==:#{window_panes},1}' 'switch-client -T root' 'switch-client -T jump-pane'
bind -T jump 7 if -F '#{m:*|7|*,#{W:|#{window_index}|}}' 'select-window -t :7' 'new-window -t :7 -c ~' \; if -F '#{==:#{window_panes},1}' 'switch-client -T root' 'switch-client -T jump-pane'
bind -T jump 8 if -F '#{m:*|8|*,#{W:|#{window_index}|}}' 'select-window -t :8' 'new-window -t :8 -c ~' \; if -F '#{==:#{window_panes},1}' 'switch-client -T root' 'switch-client -T jump-pane'
bind -T jump 9 if -F '#{m:*|9|*,#{W:|#{window_index}|}}' 'select-window -t :9' 'new-window -t :9 -c ~' \; if -F '#{==:#{window_panes},1}' 'switch-client -T root' 'switch-client -T jump-pane'

# Panes renumber on kill, so the letter is only honest with the jump bind
# following the pane order — `a` is always the first pane. The border below
# prints the same index the key addresses.
#
# Written twice because tmux cannot forward a key from one table to another:
# `jump` is the letter pressed on its own, `jump-pane` the letter after a
# digit. Neither re-arms, so the letter is where the switcher ends.
bind -T jump      a select-pane -t :.1
bind -T jump-pane a select-pane -t :.1
bind -T jump      b select-pane -t :.2
bind -T jump-pane b select-pane -t :.2
bind -T jump      c select-pane -t :.3
bind -T jump-pane c select-pane -t :.3
bind -T jump      d select-pane -t :.4
bind -T jump-pane d select-pane -t :.4
bind -T jump      e select-pane -t :.5
bind -T jump-pane e select-pane -t :.5
bind -T jump      f select-pane -t :.6
bind -T jump-pane f select-pane -t :.6
bind -T jump      g select-pane -t :.7
bind -T jump-pane g select-pane -t :.7
bind -T jump      h select-pane -t :.8
bind -T jump-pane h select-pane -t :.8
bind -T jump      i select-pane -t :.9
bind -T jump-pane i select-pane -t :.9

# In the same table so one F5 arms everything. `Left` and `Up` put the new
# pane before the current one, `Right` and `Down` after it.
bind -T jump Left  split-window -hb -c "#{E:@cwd}"
bind -T jump Right split-window -h  -c "#{E:@cwd}"
bind -T jump Up    split-window -vb -c "#{E:@cwd}"
bind -T jump Down  split-window -v  -c "#{E:@cwd}"

# Close the pane. TRAP: only in `jump`, never in `jump-pane`. After a digit
# the switcher is waiting for a pane letter while you are about to type into
# the window you just landed on, and there a `q` is the first letter of a word
# — a dropped letter costs a keystroke, a killed pane costs the work in it.
bind -T jump q kill-pane

# ── pane borders: the pane's letter, so the label matches the key ──────────
#
# `#{a:N}` is chr(N); `#{e|+|:64,N}` is addition. Pane 1 reads `A`, pane 9
# `I` — uppercase is display only, the key you press is lowercase. The chip is
# video-inverse and sits in the pane's OUTERMOST RIGHT column, the same corner
# the window digits occupy on the status bar: one place to look for "which key
# gets me there", whether the target is a window or a pane. The active marker
# rides to its left so the letter itself stays flush with the edge.
# Letters ride the same index the `a`..`i` binds address, so a renumber is
# reflected the instant it happens. Single-pane windows carry no border at
# all (the hook below turns the strip off).

# ── F3 / Shift+F3 — search here, search everywhere ─────────────────────────
#
# The one finder gesture. It replaces the shell's Ctrl-Space, F1 and Ctrl-T,
# and it is a tmux binding rather than a reedline one precisely so that it is
# not the shell's: a root binding fires inside nvim, inside a Claude pane,
# inside anything, because tmux takes the key before the program in the pane
# sees it.
#
# The pair is a scope, not two tools. F3 searches the directory the pane is in
# and answers in about half a second; Shift+F3 searches $HOME and cannot, so it
# streams — the lanes you navigate by arrive first and the exhaustive ones fill
# in behind them. Plain is the one you press fifty times a day, so plain is the
# fast one.
#
# `-E` closes the popup when tv-all exits. `-d` starts it in the pane's own
# directory, which is what F3's scope IS — without it the search would be
# rooted wherever the tmux server happened to start. TV_ALL_ORIGIN is the pane
# to split from once something is picked: a popup is not part of the window
# layout, so it has no position of its own, and the pane you came FROM is the
# only sensible anchor.
#
# TRAP: the `#{pane_id}` MUST be quoted. tmux's config parser treats a bare `#`
# as the start of a comment, so an unquoted `-e VAR=#{pane_id}` swallows the
# rest of the line and the file dies with `syntax error` — the format expands
# fine, it just never gets read. `-d` is quoted for the same reason.
#
# Two popups, not one, and that is forced rather than chosen: tmux allows
# exactly ONE popup per client, so a one-line prompt and a full-height list of
# results cannot be the same window. The binding runs them in sequence — tmux
# blocks on `display-popup -E` until it closes — and the query is handed over in
# a file named for this pane. The `if-shell` between them is what makes cancel
# silent: no query, no second popup, rather than one that flashes and vanishes.
#
# -x and -y are NOT optional. Leaving them out does not centre the popup —
# display-popup inherits display-menu's default, which is anchored near the
# pane rather than in the middle of anything, and the box lands off to one
# side. Written out, the two keys differ in what they centre ON: F3 is the
# local search so its box sits in the middle of the PANE, and Shift+F3 is the
# machine-wide one so its box sits in the middle of the TERMINAL. The position
# is the scope, before you have read the title.
bind -n F3 \
    display-popup -E -w 52 -h 3 -b rounded -T ' search ' \
        -x "#{e|+|:#{pane_left},#{e|/|:#{e|-|:#{pane_width},52},2}}" \
        -y "#{e|+|:#{pane_top},#{e|/|:#{e|-|:#{pane_height},3},2}}" \
        -d '#{E:@cwd}' \
        -e "TV_ALL_ORIGIN=#{pane_id}" \
        "~/.local/bin/tv-all here ask" \; \
    if-shell 'test -s "${XDG_CACHE_HOME:-$HOME/.cache}/tv-all/pending-$(printf %s "#{pane_id}" | tr -cd A-Za-z0-9)"' \
        'display-popup -E -B -w 90% -h 85% -x C -y C -d "#{E:@cwd}" -e "TV_ALL_ORIGIN=#{pane_id}" "~/.local/bin/tv-all here"'

bind -n S-F3 \
    display-popup -E -w 52 -h 3 -b rounded -T ' search everywhere ' -x C -y C \
        -d '#{E:@cwd}' \
        -e "TV_ALL_ORIGIN=#{pane_id}" \
        "~/.local/bin/tv-all everywhere ask" \; \
    if-shell 'test -s "${XDG_CACHE_HOME:-$HOME/.cache}/tv-all/pending-$(printf %s "#{pane_id}" | tr -cd A-Za-z0-9)"' \
        'display-popup -E -B -w 90% -h 85% -x C -y C -d "#{E:@cwd}" -e "TV_ALL_ORIGIN=#{pane_id}" "~/.local/bin/tv-all everywhere"'

# TRAP on the result popups above: `-B`, not `-b rounded`. television draws its
# own rounded frames around the input, the results and the preview, so a tmux
# border around them is a SECOND frame one cell outside the first — and tv
# redraws its own on every keystroke while tmux only repaints its border when
# it thinks it must, so the outer one comes apart in pieces as you type. One
# frame, drawn by whoever is drawing the content.

# The escape hatch for a nested session, F5's rule applied to F3. A root
# binding is taken by the OUTERMOST server, so an inner tmux in a pane can
# never see F3 on its own; `F5 F3` sends a literal F3 down instead. It rides
# the jump table because that table is already the one-shot "the next key is
# not for me" mode, and a key it does not bind is dropped rather than passed.
bind -T jump F3 send-keys F3

# ── F6 — theme toggle, never forwarded to a nested session ──────────────────

# `sh -lc` is a login shell so path_helper supplies Homebrew's bin; the PATH
# prefix is for tinty in ~/.local/bin, which no login shell adds.
#
# `> /dev/null` is the whole point of the toggle: run-shell displays anything
# the command writes to stdout in a popup, so `_theme_toggle`'s one-line
# confirmation used to land as an overlay over the panes — announcing a change
# you are looking straight at. The colours ARE the feedback. stderr is
# deliberately NOT redirected: a broken tinty is worth the popup.
bind -n F6 run-shell -b 'PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH" sh -lc '"'"'exec nu -n -c "source $HOME/.config/nushell/theme.nu; _theme_toggle" > /dev/null'"'"''

# ── copy mode ───────────────────────────────────────────────────────────────

# Stated, not inherited: tmux picks mode-keys from $EDITOR when unset.
set -gw mode-keys vi

# pbcopy reaches the clipboard of the machine the panes are on; OSC 52 reaches
# the machine you are sitting at. The arms are exclusive — under `on`,
# copy-pipe-and-cancel would fire both.
#
# TRAP: naming the sink is not enough, and this is the bug that shipped.
# EVERY stock copy path — the mouse drag-release, double- and triple-click,
# `Enter` — calls `copy-pipe-and-cancel` with NO command. That fills tmux's
# own paste buffer and stops there, and with `set-clipboard off` the buffer is
# the end of the line: the text highlights, it looks copied, and Cmd+V still
# pastes whatever the system clipboard held before. Only `y` named the sink,
# so only `y` worked. Measured 2026-09-01 — `copy-pipe-and-cancel` with no
# argument left the buffer holding the line and pbpaste unchanged.
#
# So the sink is an OPTION every copy path names, and `send -FX` is what
# expands it: plain `send -X` does not expand formats in its arguments and
# would pipe to the literal string `#{@copy-pipe}`.
if-shell 'command -v pbcopy >/dev/null 2>&1' {
    set -g @copy-pipe 'pbcopy'
    set -s set-clipboard off
} {
    # An empty pipe still sets the buffer, and `set-clipboard on` turns that
    # into the OSC 52 that carries it to the terminal's own machine.
    set -g @copy-pipe ''
    set -s set-clipboard on
}

# F4 is the entry, and a plain function key is the whole point: it asks
# nothing of the terminal, so it is the same key over ssh, on a serial console
# and under an emulator nobody has configured. It sits with F3 (search), F5
# (jump) and F6 (theme) in the row this config reserves for keys no program in
# a pane will want.
#
# RETIRED 2026-09-01: `bind -n C-S-x copy-mode`. Ctrl+Shift+X cannot be spelled
# in the legacy encoding — it is byte 0x18, identical to plain Ctrl+X — so it
# only arrives where the terminal has negotiated CSI-u or modifyOtherKeys. tmux
# decodes both spellings, but decoding was never the failing half: the terminal
# has to SEND one, and measured on this desk it does not, so the key reached
# tmux as an unbound C-x and went straight through to the pane. Copy mode never
# opened and nothing said why. A binding that works only where the emulator
# cooperates is what I1 forbids, so it is gone rather than kept as a second
# name for F4 that silently does nothing.
bind -n F4 copy-mode

# F5's rule applied to F4: a root binding is taken by the OUTERMOST server, so
# an inner tmux can never see F4 on its own.
bind -T jump F4 send-keys F4

set-hook -g after-copy-mode 'set -pu @copy-cycle'

# cell -> word -> line -> cell. set-mark records the anchor because select-word
# and select-line leave the cursor at the END of the selection.
bind -T copy-mode-vi c {
    if -F '#{==:#{@copy-cycle},cell}' {
        send -X select-word
        set -p @copy-cycle word
    } {
        if -F '#{==:#{@copy-cycle},word}' {
            send -X select-line
            set -p @copy-cycle line
        } {
            if -F '#{==:#{@copy-cycle},line}' { send -X jump-to-mark }
            send -X set-mark
            send -X clear-selection
            send -X begin-selection
            set -p @copy-cycle cell
        }
    }
}

# TRAP: the reset MUST stay after the copy. A set-option before a copy command
# silently suppresses the OSC 52 — buffer set, clipboard never moves, nothing
# logged.
bind -T copy-mode-vi y {
    send -FX copy-pipe-and-cancel "#{@copy-pipe}"
    set -pu @copy-cycle
}

# `Enter` is the other half of vi's muscle memory and stock binds it to the
# sinkless copy; rebound here for the same reason `y` is.
bind -T copy-mode-vi Enter {
    send -FX copy-pipe-and-cancel "#{@copy-pipe}"
    set -pu @copy-cycle
}

# Ctrl+C with a selection copies it; with none it leaves, which is what the
# key means everywhere else. Stock binds it to `cancel` unconditionally — so
# the obvious gesture, drag a selection and press Ctrl+C, threw the selection
# away and touched no clipboard. `selection_present` is the test.
#
# Unlike the retired chord above this one arrives anywhere: 0x18 for Ctrl+X was
# the unspellable case, 0x03 for Ctrl+C is not. Where an emulator binds the key
# first it must fall through when it holds no selection of its own — which
# under `mouse on` is always, since the drag never reaches it — and where no
# emulator binds it the byte arrives here directly. Both routes end on this
# line, which is what makes the gesture the same over ssh as it is locally.
bind -T copy-mode-vi C-c {
    if -F '#{selection_present}' \
        'send -FX copy-pipe-and-cancel "#{@copy-pipe}"' \
        'send -X cancel'
    set -pu @copy-cycle
}

# ── the mouse copies too ────────────────────────────────────────────────────
#
# `mouse on` moved selection from the terminal to tmux — it has to, because a
# terminal-level drag across a split grabs both panes' columns as one line.
# Having taken the gesture, tmux owes it a clipboard: these three are the stock
# bindings with the sink written in, and nothing else about them changes.
# `mouse_any_flag` keeps a program that tracks the mouse itself — nvim, an
# agent pane — getting its own clicks.
bind -T copy-mode-vi MouseDragEnd1Pane send -FX copy-pipe-and-cancel "#{@copy-pipe}"

bind -n DoubleClick1Pane select-pane -t = \; if -F '#{||:#{pane_in_mode},#{mouse_any_flag}}' \
    { send -M } \
    { copy-mode -H ; send -X select-word ; run-shell -d 0.3 ; send -FX copy-pipe-and-cancel "#{@copy-pipe}" }

bind -n TripleClick1Pane select-pane -t = \; if -F '#{||:#{pane_in_mode},#{mouse_any_flag}}' \
    { send -M } \
    { copy-mode -H ; send -X select-line ; run-shell -d 0.3 ; send -FX copy-pipe-and-cancel "#{@copy-pipe}" }

# ── status bar ──────────────────────────────────────────────────────────────
#
# Colours are ANSI slots, never hex, so a `tinty apply` retints them for free.

# TWO ROWS, both at the top. Row 0 is ambient — the clock and the window
# digits, what is true of the session. Row 1 is THIS window: where its active
# pane is, what that pane runs, and which pane letters the window holds.
#
# Both rows sit wherever `status-position` says, because it is ONE option for
# the whole bar. Measured 2026-09-01 on 3.7c: `status 2` with
# `status-position top` drew both at screen rows 1 and 2, so "tabs at the top
# and the window status at the bottom" is not available. Neither is an overlay
# at the bottom: tmux's only overlay is a popup, it is per client, it covers
# pane content rather than reserving a row, and it takes EVERY key while it is
# up — `-N` only cancels `-E`/`-k`, it does not make a popup passive. Top it is.
set -g status 2
set -g status-position top
set -g status-interval 5
set -g status-style 'bg=colour0,fg=colour8'
set -g status-left-length 120
set -g status-right-length 0

# The window digits sit top-RIGHT, over the same edge each pane prints its
# letter on, so both halves of the F5 address are read from one corner. The
# ambient facts — where the active pane is, and the time — move left, because
# they are what you glance at, never what you type.
#
# The window list is placed by `status-justify`, not by any format, so `right`
# only reaches the terminal's right edge while `status-right` is EMPTY: tmux
# right-aligns the list within the space the two flanking segments leave, and
# anything in status-right would push it inward by its own width.
set -g status-justify right
set -g status-right ''

# The clock is the OUTERMOST left cell: it is the one segment whose width never
# changes, so it is the only one that can anchor the corner. A cwd first would
# put the time at a column that moves with every `cd`, which is what makes a
# clock hard to read at a glance — so everything that moves with a `cd` is on
# row 1 now, and row 0's left is the clock and nothing else.
# The key-table chip is the one piece of feedback the gesture model had none
# of: F5 arms a table and nothing on screen said so. `jump` means a digit, a
# letter, an arrow or `q` is expected; `jump-pane` means the letter is still to
# come. It costs nothing — a format on `#{client_key_table}`, no shell, no
# plugin — and it is the awesome-tmux prefix-highlight idea rebuilt on the
# tables this config actually uses, since there is no prefix key here to
# highlight.
#
# TRAP for anyone re-measuring it: a REAL keypress redraws the status, so the
# chip appears and clears instantly (measured 2026-09-01 by driving F5 into an
# attached client). Driving the same change from the CLI with `switch-client
# -T jump` does NOT mark the status dirty, so the chip does not appear until
# the next tick — which reads exactly like a broken format and is not one.
#
# The `✳N` chip counts the Claude Code sessions open in this tmux session, and
# it is a session-wide fact, which is why it sits on row 0 beside the clock
# rather than on the window row. `#{W:...}` loops windows and `#{P:...}` loops
# that window's panes, so the pair walks every pane; each Claude pane emits one
# `x` and `#{n:}` takes the length of what comes back. No shell, no counter to
# keep in step — the number cannot be stale, because it is computed at draw
# time from the panes themselves.
#
# TRAP: the loops take TWO comma-separated arguments (`#{P:other,current}`), so
# a bare comma inside one splits it instead of printing. Commas nested inside a
# `#{?...}` are safe; a top-level one is not. `#{W:#{window_index},}` printed
# only the non-current windows for exactly this reason while it was being
# written.
#
# Zero renders as nothing: `#{?...}` treats "0" as false, so the chip appears
# with the first Claude pane and vanishes with the last.
set -g status-left '#[fg=colour7] %H:%M #{?#{!=:#{client_key_table},root},#[reverse] #{client_key_table} #[default],}#{?#{n:#{W:#{P:#{?#{m:✳*,#{pane_title}},x,}}}},#[fg=colour7]  ✳#{n:#{W:#{P:#{?#{m:✳*,#{pane_title}},x,}}}},}'

# ── row 1: this window ──────────────────────────────────────────────────────
#
# Left is where the active pane is and what state that work is in; right is the
# window's panes, each as its LETTER AND WHAT IT RUNS — `A nu  B nvim  C claude`
# — with the active one lit. That pairing is the point: the letter is the key
# F5 addresses, so the row answers "which key gets me to the editor" without
# switching panes to find out. The command is truncated at 10 columns so a long
# argv cannot push the list into the path.
#
# A Claude pane is recognised by its TITLE, not its command. Claude Code sets
# the pane title to `✳ <what it is doing>` and runs as its own version string —
# `#{pane_current_command}` on a Claude pane reads `2.1.252`, measured
# 2026-09-01 — so matching the command would break on the next Claude release
# and print a version number where a name belongs. The title marker is stable
# and is what the count on row 0 keys off too.
#
# Guarded on `window_panes > 1`: a single-pane window has no letter worth
# pressing, so it prints the command alone, the same rule the border strip
# follows. A zoom or a copy-mode flag rides on the left, which is the
# awesome-tmux mode-indicator idea done as a format rather than a plugin.
#
# THE GIT SEGMENT, and why it is here after all. The first cut left it out
# because starship prints the same facts in the prompt one line below, and a
# bar that repeats the prompt has spent a row saying nothing. That was wrong,
# and the counter-case is the common one: the prompt is only on screen while a
# pane sits AT a prompt. Open nvim, tail a log, hand the pane to Claude, and
# the branch you are on disappears from the screen entirely. The bar is the
# surface that is always there. `~/.local/bin/tmux-git` holds the reasons for
# how it asks git; it prints nothing outside a work tree, so the segment is
# simply absent rather than erroring.
#
# The host rides HERE rather than beside the clock: over ssh the host and the
# path are one fact, and a path is meaningless without knowing whose it is.
# Decided once at parse time — the format language cannot tell where the client
# is, but a server started over ssh inherits SSH_CONNECTION.
#
# WHY THE HOST GOES THROUGH `@host` INSTEAD OF TWO ARMS. Two quoting rules
# collide in this one line, and the option is what stops them. `$HOME` is
# expanded by tmux at parse time in DOUBLE quotes only — written in single
# quotes it reaches the format literally, nothing matches, and the row prints
# the full `/Users/...` path with no error to say why (measured 2026-09-01
# while building this row). But `#(...)` needs its argument quoted, and inside
# a `"…'…'…"` if-shell arm neither quote is available: the outer `"` ends the
# arm and the inner `'` ends the command. Setting `@host` in the arms and
# writing the format ONCE at top level gives it double quotes for `$HOME` and
# leaves `'` free for the shell. An earlier note here said routing the host
# through a user option would put a format inside a format — it does, and
# `#{E:@host}` expands it correctly: measured 2026-09-01, the ssh arm rendered
# `mac` from a stored `#{host_short}`.
#
# The cwd is `@cwd`'s expression spelled out rather than `#{E:@cwd}`, because
# `:...` names a VARIABLE, so a substitution cannot be applied to an expanded
# option — `#{s|^$HOME|~|:@cwd}` substitutes over the option's literal text and
# `:E:@cwd` yields "". Both measured 2026-09-01. The `~` therefore rides inside
# the branch, chained onto the host strip with `;`, which is how one `#{}`
# carries two substitutions. The git helper takes `#{E:@cwd}` instead, since it
# wants the real absolute path and not the `~` the eye wants. Keep both in step
# with `@cwd` above; that block holds the reasons.
if-shell '[ -n "$SSH_CONNECTION" ]' \
    'set -g @host "#{host_short}  "' \
    'set -g @host ""'

set -g status-format[1] "#[align=left]#[fg=colour8] #{E:@host}#{?#{m:file://#{host}/*,#{pane_path}},#{s|^file.//[^/]*/|/|;s|^$HOME|~|:pane_path},#{s|^$HOME|~|:pane_current_path}}  #[fg=colour7]#(~/.local/bin/tmux-git '#{E:@cwd}')#{?window_zoomed_flag,#[fg=colour7]  zoom,}#{?pane_in_mode,#[fg=colour7]  #{pane_mode},}#[align=right]#{?#{>:#{window_panes},1},#{P:#{?pane_active,#[fg=colour15],#[fg=colour8]}#{a:#{e|+|:64,#{pane_index}}} #{?#{m:✳*,#{pane_title}},claude,#{=10:pane_current_command}}  },#[fg=colour8]#{?#{m:✳*,#{pane_title}},claude,#{=20:pane_current_command}} }"

# Background says which window has focus, foreground says which are busy.
# The `|` delimiters are the fnmatch trap again — `nu` vs `nushell`.
set -g window-status-separator ''
set -gw window-status-format '#[fg=#{?#{m:*X*,#{P:#{?#{m:*|#{pane_current_command}|*,|nu|sh|bash|zsh|fish|login|},,X}}},colour7,colour8}] #I '
set -gw window-status-current-format ' #I '
# A style option, not inline in the format, so colors.conf can override it.
set -gw window-status-current-style 'bg=colour8,fg=colour15,bold'
set -gw window-status-style 'bg=colour0,fg=colour8'

# TRAP: `#[align=right]` is a `format_draw` attribute and the manpage documents
# it for the status line only — pane-border-format is not listed. It does work:
# measured 2026-09-01 on tmux 3.7c, both panes of a vertical split printed the
# chip flush against their own right edge. Check it again after a tmux upgrade,
# because a silent regression here is a chip that drifts back to column 0
# rather than an error anybody sees.
set -gw pane-border-format '#[align=right]#{?pane_active,* ,}#[reverse] #{a:#{e|+|:64,#{pane_index}}} #[default]'
set -gw pane-border-style 'fg=colour8'
set -gw pane-active-border-style 'fg=colour7'

# No lines at all: `spaces` fills every border cell with a space, so a seam
# reads as background and the only mark on it is the pane's letter chip.
#
# ASKED AND ANSWERED, 2026-09-01 — a dot at the junctions and empty everywhere
# else is NOT available, and the next person to want it should read this rather
# than re-derive it. The border glyphs are compiled-in tables in tmux.h
# (`CELL_BORDERS " xqlkmjwvtun~"`, `SIMPLE_BORDERS " |-+++++++++."`) chosen by a
# six-value enum; `pane-border-lines` selects a TABLE and no option anywhere
# names a border character. One table and one style cover EVERY border cell, so
# blanking the runs blanks `├` and `┼` with them. Measured on 3.7c against a
# three-pane layout: under `single` the T printed at column 50, under `spaces`
# that same cell came back a space. The five values in the manpage are the whole
# set — `padded` and `none` in the binary's strings belong to
# popup-border-lines and are rejected here.
#
# A ~40-line patch adding a `dots` value does work (it was built and run: a
# single `●` on the five JOIN cells, nothing on a two-pane seam). It was
# DECLINED — this environment runs a stock tmux, and one patched binary was
# already retired for the F5 overlay. Empty seams are the answer that needs no
# build.
set -gw pane-border-lines spaces

set -gw pane-border-status off
set-hook -g window-layout-changed 'if -F "#{==:#{window_panes},1}" "setw pane-border-status off" "setw pane-border-status top"'

# ── the inactive panes recede ───────────────────────────────────────────────
#
# TRAP: the `dim` attribute is DROPPED from these styles. tmux merges only the
# COLOURS of window-style into a cell, never the attributes -- measured
# 2026-09-01 on 3.7c: text carrying a real SGR 2 captures back as `\033[2m`,
# while `window-style 'dim'` leaves every cell in the pane unchanged. So the
# dimming is a colour: base03 where the active pane is base05, which is about
# the half-step asked for.
#
# It reaches DEFAULT-coloured text only. A cell that names its own colour keeps
# it, so a highlighted buffer or a coloured prompt in an inactive pane stays
# bright; a plain shell pane recedes fully. That is the whole of what tmux
# offers -- there is no per-pane fade.
#
# TRAP: window-active-style MERGES over window-style rather than replacing it,
# so `fg=default` there does NOT mean "leave the active pane alone" -- default
# is "no override", and the dim fg then wins in the active pane too, which is
# how this first went in with every pane dimmed. `terminal` is the value that
# names the emulator's own colour. It is also what keeps the background
# untouched, so the opacity and blur survive: any explicit `bg=` here would
# paint an opaque ground over every pane.
set -gw window-style 'fg=colour8'
set -gw window-active-style 'fg=terminal,bg=terminal'

set -gw mode-style 'bg=colour8,fg=colour15'
set -g message-style 'bg=colour8,fg=colour15'

# ── palette ─────────────────────────────────────────────────────────────────

# TRAP: `-q` IS the existence test. An if-shell here fails at load — tmux does
# its own ${...} expansion and has no `:-` form. Sourced last so it wins.
source-file -q ~/.config/tmux/colors.conf
source-file -q "$XDG_CONFIG_HOME/tmux/colors.conf"

# The conf above dresses tmux's OWN surfaces. The attached TERMINAL's palette
# is a separate wire, and nothing on an attach writes it: config.nu re-asserts
# the scheme by sourcing tinted-shell's artifact when a SHELL starts, and
# `tmux new-session -A` starts no shell when the session already exists. So a
# second WezTerm window — the common case, since the session outlives the
# emulator — attached wearing WezTerm's builtin Gruvbox fallback and stayed
# there until the next `theme` pick. Fixed 2026-09-01.
#
# tmux-colors.sh's osc_push is the one thing that can close it: it writes OSC
# 4/10/11/12 straight to every `#{client_tty}`, so running it on attach costs
# one `list-clients` and repaints the terminal that just arrived. `-b` so a
# slow disk cannot hold the attach; the script re-reads current_scheme itself,
# so it needs no argument.
set-hook -g client-attached 'run-shell -b "$HOME/.config/tinted-theming/tinty/tmux-colors.sh"'

# ── persistence ─────────────────────────────────────────────────────────────
#
# No tpm: install.sh clones the plugins and the two run-shell lines declare
# them. State, not data — a snapshot is losable.

set -g @resurrect-dir '~/.local/state/tmux/resurrect'
# Inline strategy, not 'session': that one needs a Session.vim in every cwd.
set -g @resurrect-processes '"~nvim->nvim -c \"lua require(\\\"persistence\\\").load()\""'
set -g @resurrect-capture-pane-contents 'off'
set -g @continuum-save-interval '15'
set -g @continuum-restore 'on'

# TRAP: guard and run must be ONE sh command. Wrapping run-shell in an if-shell
# loads silently and runs nothing — tmux expands ${...} itself and has no `:-`.
run-shell 'f="${XDG_DATA_HOME:-$HOME/.local/share}/tmux/plugins/tmux-resurrect/resurrect.tmux"; [ -x "$f" ] && "$f"'
# Continuum LAST: its init reads the @continuum-* options set above.
run-shell 'f="${XDG_DATA_HOME:-$HOME/.local/share}/tmux/plugins/tmux-continuum/continuum.tmux"; [ -x "$f" ] && "$f"'

# ── Claude Code in a pane ───────────────────────────────────────────────────
#
# Shift+Enter inserts a newline instead of submitting. Safe against the
# use_kitty_protocol=false pairing: tmux only sends extended keys to a pane
# that asks, and nushell never asks.
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'
