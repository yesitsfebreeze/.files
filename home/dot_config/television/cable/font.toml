# `tv font` — the font list as a plain tv channel, so F8 lists it. F8 opens
# it in tv-go's fzf picker, which previews every focus in the whole terminal.

[metadata]
name = "font"
description = "terminal font — live preview, enter applies"
requirements = ["fc-list"]

[source]
command = "~/.config/wezterm/font.sh --list"
output = "{}"
no_sort = true
frecency = false

[preview]
command = "~/.config/wezterm/font.sh --preview '{}'"

[ui.input_bar]
header = "font: {}"
