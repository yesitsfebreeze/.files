[metadata]
name = "recent-files"
description = "List recently modified files"
requirements = ["fd", "bat"]

[source]
command = [
  { name = "Recent",    run = "fd -t f --changed-within 7d" },
  { name = "Last hour", run = "bash -c \"find . -type f -mmin -60 -not -path '*/.*' 2>/dev/null | head -100\"" },
]

[preview]
command = "bat -n --color=always '{}'"
env = { BAT_THEME = "ansi" }

[keybindings]
enter = "actions:edit"

[actions.edit]
description = "Open the selected file in editor"
command = "${EDITOR:-nvim} '{}'"
shell = "bash"
mode = "execute"
