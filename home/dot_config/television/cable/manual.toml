# manual — the fuzzy browser over this environment's manual
# (06-help/03-browser R1). The rows come from help.nu's `_help_rows`; the
# runner in help.nu (`_help_browse`) decides what `enter` and `ctrl-o` do
# with the row it gets back.
#
# THE CHANNEL IS `manual`, NOT `help`, AND THAT IS FORCED. Measured on tv
# 0.15.9: `help` is a clap SUBCOMMAND of tv, so `tv help` prints tv's own
# usage at rc 0 and never opens the channel — even though `tv list-channels`
# lists it. `tv -- help` does reach it, but that only fixes our own runner:
# `finder --start help` and Ctrl-T both run `tv <channel>` WITH flags, so a
# channel named `help` would hand tv's usage text to `_finder_decode` as rows
# and then to `_finder_open` as a path. `manual` is neither a subcommand nor
# a builtin channel. The one cost, recorded so nobody reads it as a defect:
# typing "help" in the Ctrl-Space remote will not match this channel, because
# `_finder_pick_channel` matches channel NAMES only (finder.nu).
#
# Field indexes are `_help_rows`' four-field row: 0 topic, 1 id, 2 title,
# 3 the entry's INDEX IN THE FULL CORPUS.

[metadata]
name = "manual"
description = "Every entry in this environment's manual — enter prints it into the scrollback, ctrl-o opens its PRD in $EDITOR"
requirements = ["nu"]

# The nu code rides in SINGLE quotes: television hands this line to $SHELL,
# and while nu never expands $vars inside plain strings, a bourne fallback
# would expand them inside double quotes to nothing. `nu -n` loads no config,
# which is the latency reason nu-history.toml records: the builtin channels
# that cold-start a FULL nushell re-source starship, zoxide and the tv init
# on every keypress.
[source]
command = "nu -n -c 'source ~/.config/nushell/help.nu; _help_rows'"
# NO `no_sort` AND NO `frecency` KEYS — the deliberate OPPOSITE of
# cable/quicklist.toml, which sets both. That channel is a newest-first log
# where any re-ranking is wrong; THIS channel IS a search, so tv's match
# ranking is the whole point. Do not "fix" one into the other. Row order is
# irrelevant to correctness here because the row carries its own corpus
# index (field 3).
#
# THE `\\t` ESCAPING TRAP: `\\t` in TOML reaches tv as the literal escape
# `\t`, which its template engine treats as the tab delimiter. A single `\t`
# here would be a REAL tab character and the template would stop splitting.
display = "{split:\\t:0}  {split:\\t:1} — {split:\\t:2}"
# The WHOLE row, because the runner needs the id column to address the entry
# and a caller cannot recover a field tv did not emit.
output = "{}"

[preview]
# THE PREVIEW ADDRESSES THE ROW INDEX, NOT THE ENTRY ID, and that is
# measured rather than stylistic: tv substitutes template fields TEXTUALLY
# into a line it hands to $SHELL, and one live entry id is
# `Neovim's own LSP keys` — an apostrophe that closes the shell quote around
# it. An integer has no shell-hostile character at all. This is the only
# reason field 3 exists; the runner identifies entries by id.
#
# The index is the entry's position in the FULL corpus, computed BEFORE any
# `--mode` filter (see `_help_rows`): this command is fixed while the source
# command is overridden per call, so an index counted over a filtered subset
# would make the preview name a different entry than the row it previews.
command = "nu -n -c 'source ~/.config/nushell/help.nu; _help_preview {split:\\t:3}'"

[ui]
# The `use` paragraph is long; cht.toml sets 50 for the same reason.
preview_panel = { size = 55 }

# THIS FILE BINDS NO KEYS AND DECLARES NO ACTIONS, deliberately, exactly as
# cable/quicklist.toml does it: `enter` is un-hijacked on the CLI by the
# runner, and `ctrl-o` must reach the runner through `--expect` rather than
# fork a shell command out of the picker. Both TOML spellings are kept OUT of
# this file entirely — this comment included, which is why it says it in
# words — so a grep hit for either is proof of a regression and never of a
# sentence explaining one. That is the history.nu discipline, applied to a
# cable file; the gate greps for both.
