# `tv theme` — the scheme list as a plain tv channel. F8, F9 and `theme` use
# tv-go's fzf picker instead, which re-runs the preview on every focus.

[metadata]
name = "theme"
description = "base16/base24 colour schemes — live preview, enter applies"
requirements = ["tinty"]

[source]
command = "~/.config/tinted-theming/tinty/theme.sh --list"
output = "{}"
no_sort = true
frecency = false

[preview]
command = "~/.config/tinted-theming/tinty/theme.sh --preview '{}'"
# The preview's job is the retint, a side effect: a cached row would show its
# swatch but leave the terminal on the last scheme painted.
cached = false

[ui]
preview_panel = { size = 65 }

[ui.input_bar]
header = "theme: {}"
